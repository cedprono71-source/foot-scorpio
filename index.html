<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL IA - Pronostics</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .date-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        input[type="date"] {
            background-color: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .match-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .match-teams {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #e2e8f0;
        }
        .match-info {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .no-match {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h1>🏒 NHL IA Pronostics</h1>
    <div class="subtitle">Sélectionnez une date pour voir les matchs</div>

    <!-- Sélecteur de date -->
    <div class="date-container">
        <input type="date" id="match-date" onchange="chargerMatchs()">
    </div>

    <div id="matches-container">
        <div class="no-match">Chargement des matchs...</div>
    </div>

    <script>
        // Sélectionner la date du jour par défaut au format AAAA-MM-JJ
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('match-date').value = today;

        async function chargerMatchs() {
            const selectedDate = document.getElementById('match-date').value;
            const container = document.getElementById('matches-container');
            container.innerHTML = '<div class="no-match">Recherche en cours...</div>';

            try {
                // Appel vers notre backend FastAPI avec la date choisie
                const response = await fetch(`/api/matches/nhl?date=${selectedDate}`);
                const data = await response.json();
                
                container.innerHTML = '';

                if (data.matches && data.matches.length > 0) {
                    data.matches.forEach(match => {
                        const card = document.createElement('div');
                        card.className = 'match-card';
                        
                        // Formater l'heure du match proprement
                        const matchTime = new Date(match.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        card.innerHTML = `
                            <div class="match-teams">${match.home_team} vs ${match.away_team}</div>
                            <div class="match-info">📅 ${match.date || selectedDate} | ⏰ ${matchTime} UTC</div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="no-match">Aucun match prévu pour cette date.</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="no-match" style="color: #ef4444;">Erreur lors du chargement des matchs.</div>';
            }
        }

        // Charger les matchs dès l'ouverture de la page
        chargerMatchs();
    </script>

</body>
</html>
