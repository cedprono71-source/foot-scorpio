<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL IA - Pronostics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #06141d;
            color: #ffffff;
            padding: 0;
        }
        
        /* En-tête principal */
        header {
            background-color: #06141d;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #142331;
        }
        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Bandeau Navigation des Dates - Style Flashscore exact */
        .date-strip-container {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .calendar-btn {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #e0e0e0;
            position: relative;
            cursor: pointer;
            background: #ffffff;
        }
        .calendar-btn span {
            font-size: 1.2rem;
        }
        .calendar-btn input[type="date"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .date-strip {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            width: 100%;
        }
        .date-strip::-webkit-scrollbar {
            display: none;
        }

        .date-item {
            flex: 0 0 auto;
            width: 54px;
            padding: 8px 0 6px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background: #ffffff;
        }

        .date-item .day-name {
            font-size: 0.65rem;
            font-weight: 700;
            color: #555555;
            text-transform: uppercase;
        }

        .date-item .day-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: #111111;
            margin-top: 2px;
        }

        /* État Sélectionné / Aujourd'hui (Barre rouge sous la date) */
        .date-item.active .day-name,
        .date-item.active .day-num {
            color: #e11238;
        }

        .date-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background-color: #e11238;
            border-radius: 2px 2px 0 0;
        }

        /* Conteneur des Matchs */
        .main-content {
            padding: 12px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #8fa3b3;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* Cartes de matchs */
        .match-card {
            background-color: #0d1e2b;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #162838;
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .match-status {
            background-color: #162838;
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .no-match {
            text-align: center;
            color: #8fa3b3;
            margin-top: 50px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>🏒</span> NHL IA Pronostics
        </div>
    </header>

    <!-- Navigation des dates Flashscore -->
    <div class="date-strip-container">
        <div class="calendar-btn" title="Sélectionner une date">
            📅
            <input type="date" id="calendar-picker" onchange="onCustomDateSelect(this.value)">
        </div>
        <div class="date-strip" id="date-strip"></div>
    </div>

    <div class="main-content">
        <div class="section-title" id="section-title">TOUS LES MATCHS</div>
        <div id="matches-container">
            <div class="no-match">Chargement des matchs...</div>
        </div>
    </div>

    <script>
        const daysFr = ['DI', 'LU', 'MA', 'ME', 'JE', 'VE', 'SA'];
        let selectedDateStr = new Date().toISOString().split('T')[0];
        const todayStr = selectedDateStr;

        // Générer le bandeau style Flashscore (-7j à +7j)
        function generateDateStrip(centerDateStr) {
            const strip = document.getElementById('date-strip');
            strip.innerHTML = '';

            const centerDate = new Date(centerDateStr);

            for (let i = -7; i <= 7; i++) {
                const d = new Date(centerDate);
                d.setDate(d.getDate() + i);

                const dateStr = d.toISOString().split('T')[0];
                const isToday = (dateStr === todayStr);
                
                const dayName = isToday ? 'AJD' : daysFr[d.getDay()];
                const dayNum = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;

                const item = document.createElement('div');
                item.className = `date-item ${dateStr === selectedDateStr ? 'active' : ''}`;
                item.dataset.date = dateStr;
                item.onclick = () => selectDate(dateStr, item);

                item.innerHTML = `
                    <span class="day-name">${dayName}</span>
                    <span class="day-num">${dayNum}</span>
                `;

                strip.appendChild(item);

                if (dateStr === selectedDateStr) {
                    setTimeout(() => {
                        item.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }, 100);
                }
            }
        }

        // Action au clic sur une date
        function selectDate(dateStr, element) {
            selectedDateStr = dateStr;
            document.querySelectorAll('.date-item').forEach(el => el.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }
            chargerMatchs(dateStr);
        }

        // Choix d'une date spécifique via calendrier
        function onCustomDateSelect(dateStr) {
            if (!dateStr) return;
            selectedDateStr = dateStr;
            generateDateStrip(dateStr);
            chargerMatchs(dateStr);
        }

        // Récupération des matchs
        async function chargerMatchs(dateStr) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '<div class="no-match">Chargement en cours...</div>';

            try {
                const response = await fetch(`/api/matches/nhl?date=${dateStr}`);
                const data = await response.json();
                
                container.innerHTML = '';

                const matchsDuJour = (data.matches || []).filter(m => {
                    if (!m.date) return true;
                    return m.date === dateStr;
                });

                if (matchsDuJour.length > 0) {
                    matchsDuJour.forEach(match => {
                        const card = document.createElement('div');
                        card.className = 'match-card';
                        
                        const matchTime = match.time 
                            ? new Date(match.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            : 'TBD';

                        card.innerHTML = `
                            <div class="teams-container">
                                <div class="team-row">🏠 ${match.home_team}</div>
                                <div class="team-row">✈️ ${match.away_team}</div>
                            </div>
                            <div class="match-status">${matchTime}</div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="no-match">Aucun match prévu à cette date.</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="no-match" style="color: #ef4444;">Erreur de chargement.</div>';
            }
        }

        // Initialisation au chargement
        generateDateStrip(selectedDateStr);
        chargerMatchs(selectedDateStr);
    </script>

</body>
</html>
