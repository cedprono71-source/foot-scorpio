<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL IA Pronostics</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #ef4444;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--text-color);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab.active {
            background-color: var(--accent-color);
            color: white;
        }

        .dates-bar {
            display: flex;
            justify-content: flex-start;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
            scroll-behavior: smooth;
        }

        .dates-bar::-webkit-scrollbar {
            height: 4px;
        }

        .dates-bar::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 4px;
        }

        .date-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            text-align: center;
            cursor: pointer;
            min-width: 45px;
            flex-shrink: 0;
        }

        .date-item.active {
            border-color: var(--accent-color);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .date-item .day {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .date-item .num {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .team-row img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .match-action {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .time-badge {
            background-color: var(--border-color);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .prono-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            background-color: rgba(239, 68, 68, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .no-matches {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .prediction-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .prob-bar-container {
            background-color: var(--border-color);
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
            display: flex;
            margin-top: 5px;
        }

        .prob-home { background-color: #3b82f6; height: 100%; }
        .prob-draw { background-color: #64748b; height: 100%; }
        .prob-away { background-color: #ef4444; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏒 NHL IA Pronostics</h1>
        </header>

        <div class="tabs">
            <div class="tab active" id="tabNhl" onclick="switchTab('nhl')">🏒 NHL</div>
            <div class="tab" id="tabFoot" onclick="switchTab('foot')">⚽ Football</div>
        </div>

        <div class="dates-bar" id="datesBar"></div>

        <div id="sectionTitle" class="section-title">MATCHS DU JOUR</div>
        
        <div id="matchesContainer">
            <div class="no-matches">Chargement des matchs...</div>
        </div>
    </div>

    <!-- Modale d'analyse -->
    <div class="modal" id="predictionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin: 0; font-size: 1.1rem;">Analyse & Pronostic</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody" class="prediction-box">
                Chargement de l'analyse IA...
            </div>
        </div>
    </div>

    <script>
        let currentSport = 'nhl';
        let selectedDate = new Date().toISOString().split('T')[0];

        function initDatesBar() {
            const bar = document.getElementById('datesBar');
            bar.innerHTML = '';
            
            for (let i = -5; i <= 14; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                
                const daysOfWeek = ['DI', 'LU', 'MA', 'ME', 'JE', 'VE', 'SA'];
                const dayName = i === 0 ? 'AJD' : daysOfWeek[d.getDay()];
                const dayNum = `${d.getDate()}.${d.getMonth() + 1}.`;

                const item = document.createElement('div');
                item.className = `date-item ${dateStr === selectedDate ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="day">${dayName}</div>
                    <div class="num">${dayNum}</div>
                `;
                item.onclick = () => {
                    selectedDate = dateStr;
                    initDatesBar();
                    loadMatches();
                };
                bar.appendChild(item);
            }
        }

        function switchTab(sport) {
            currentSport = sport;
            document.getElementById('tabNhl').className = `tab ${sport === 'nhl' ? 'active' : ''}`;
            document.getElementById('tabFoot').className = `tab ${sport === 'foot' ? 'active' : ''}`;
            loadMatches();
        }

        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            const titleEl = document.getElementById('sectionTitle');
            
            titleEl.innerText = currentSport === 'nhl' ? `MATCHS DU ${selectedDate}` : "SECTION FOOTBALL";
            container.innerHTML = `<div class="no-matches">Chargement...</div>`;

            if (currentSport === 'foot') {
                container.innerHTML = `<div class="no-matches">Aucun match de football disponible pour le moment.</div>`;
                return;
            }

            try {
                const response = await fetch(`/api/matches/nhl?date=${selectedDate}`);
                const data = await response.json();
                
                container.innerHTML = '';

                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = `<div class="no-matches">Aucun match prévu à cette date.</div>`;
                    return;
                }

                data.matches.forEach(m => {
                    let timeFormatted = "À venir";
                    if (m.time) {
                        const dateObj = new Date(m.time);
                        timeFormatted = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }

                    let actionHtml = '';
                    if (m.game_state === "OFF" || m.game_state === "FINAL") {
                        actionHtml = `<div class="score-display">${m.home_score} - ${m.away_score}</div>`;
                    } else {
                        actionHtml = `
                            <div class="time-badge">${timeFormatted}</div>
                            <button class="prono-btn" onclick="openPrediction('${m.home_team.replace(/'/g, "\\'")}', '${m.away_team.replace(/'/g, "\\'")}')">⚡ PRONO</button>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="team-info">
                            <div class="team-row">
                                <img src="${m.home_logo}" alt="" onerror="this.style.display='none'">
                                <span>${m.home_team}</span>
                            </div>
                            <div class="team-row">
                                <img src="${m.away_logo}" alt="" onerror="this.style.display='none'">
                                <span>${m.away_team}</span>
                            </div>
                        </div>
                        <div class="match-action">
                            ${actionHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = `<div class="no-matches">Erreur lors du chargement des matchs.</div>`;
            }
        }

        async function openPrediction(homeTeam, awayTeam) {
            const modal = document.getElementById('predictionModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.innerText = `${homeTeam} vs ${awayTeam}`;
            modalBody.innerHTML = `<div style="text-align: center; padding: 20px;">Analyse en cours par l'IA...</div>`;
            modal.style.display = 'flex';

            try {
                const response = await fetch('/predict/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: homeTeam, away_team: awayTeam })
                });
                const res = await response.json();

                if (res.probabilities) {
                    const pHome = res.probabilities.home_win;
                    const pDraw = res.probabilities.draw;
                    const pAway = res.probabilities.away_win;

                    modalBody.innerHTML = `
                        <div>
                            <strong>Score exact le plus probable :</strong> <span style="color: var(--accent-color); font-size: 1.2rem;">${res.predicted_score}</span>
                        </div>
                        <div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 3px;">
                                <span>${homeTeam} (${pHome}%)</span>
                                <span>N/OT (${pDraw}%)</span>
                                <span>${awayTeam} (${pAway}%)</span>
                            </div>
                            <div class="prob-bar-container">
                                <div class="prob-home" style="width: ${pHome}%;"></div>
                                <div class="prob-draw" style="width: ${pDraw}%;"></div>
                                <div class="prob-away" style="width: ${pAway}%;"></div>
                            </div>
                        </div>
                        <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; font-size: 0.85rem;">
                            <strong>Gardiens probables :</strong><br>
                            🏠 ${res.goalies.home.name} (${res.goalies.home.save_pct * 100}%)<br>
                            ✈️ ${res.goalies.away.name} (${res.goalies.away.save_pct * 100}%)
                        </div>
                        <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; font-size: 0.85rem;">
                            <strong>Over / Under 5.5 buts :</strong> ${res.over_under_5_5.over_prob}% de chances de voir + de 5.5 buts.
                        </div>
                    `;
                } else {
                    modalBody.innerHTML = `<div style="color: var(--accent-color);">Impossible de récupérer les prédictions pour ce match.</div>`;
                }
            } catch (e) {
                modalBody.innerHTML = `<div style="color: var(--accent-color);">Erreur de connexion avec le serveur de prédiction.</div>`;
            }
        }

        function closeModal() {
            document.getElementById('predictionModal').style.display = 'none';
        }

        // Fermer la modale si on clique en dehors
        window.onclick = function(event) {
            const modal = document.getElementById('predictionModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        initDatesBar();
        loadMatches();
    </script>
</body>
</html>
