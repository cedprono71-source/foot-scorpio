<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL GoalScorer Analytics</title>
    <!-- Tailwind CSS pour un design moderne et sombre -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- En-tête -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-red-500 flex items-center gap-2">
                🏒 NHL <span class="text-white text-sm font-normal">Anytime Goalscorer</span>
            </h1>
            <!-- Sélecteur de date -->
            <input type="date" id="date-picker" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-red-500">
        </div>
    </header>

    <!-- Contenu Principal : Liste des matchs -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6">
        <div id="loading" class="text-center py-12 text-slate-400">Chargement des matchs NHL...</div>
        <div id="matches-container" class="space-y-4"></div>
        <div id="no-matches" class="hidden text-center py-12 text-slate-500">Aucun match NHL trouvé pour cette date.</div>
    </main>

    <!-- Modale de Prédiction (Buteurs) -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            
            <!-- Modal Header -->
            <div class="p-4 bg-slate-800/50 border-b border-slate-800 flex justify-between items-center">
                <div id="modal-teams" class="font-bold text-lg text-white">Analyse du Match</div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold px-2">&times;</button>
            </div>

            <!-- Modal Body (Onglets Domicile / Extérieur) -->
            <div class="p-4 flex-1 overflow-y-auto space-y-4">
                <!-- Boutons de sélection d'équipe -->
                <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button id="btn-home" onclick="switchTab('home')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-red-600 text-white transition">Domicile</button>
                    <button id="btn-away" onclick="switchTab('away')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition">Extérieur</button>
                </div>

                <!-- Conteneur des joueurs -->
                <div id="players-container" class="space-y-3">
                    <!-- Injection dynamique des buteurs -->
                </div>
            </div>

        </div>
    </div>

    <!-- Script JavaScript Front-End -->
    <script>
        let currentMatchData = null;
        let activeTab = 'home';

        // Initialisation de la date du jour au format YYYY-MM-DD
        const todayStr = new Date().toISOString().split('T')[0];
        const datePicker = document.getElementById('date-picker');
        datePicker.value = todayStr;

        datePicker.addEventListener('change', (e) => {
            loadMatches(e.target.value);
        });

        loadMatches(todayStr);

        async function loadMatches(date) {
            const container = document.getElementById('matches-container');
            const loading = document.getElementById('loading');
            const noMatches = document.getElementById('no-matches');

            loading.classList.remove('hidden');
            container.innerHTML = '';
            noMatches.classList.add('hidden');

            try {
                const response = await fetch(`/api/matches/nhl?date=${date}`);
                const data = await response.json();
                loading.classList.add('hidden');

                if (!data.matches || data.matches.length === 0) {
                    noMatches.classList.remove('hidden');
                    return;
                }

                data.matches.forEach(match => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between hover:border-slate-700 transition cursor-pointer";
                    card.onclick = () => fetchPrediction(match.home_team, match.away_team);

                    card.innerHTML = `
                        <div class="flex items-center gap-4 flex-1 justify-end">
                            <span class="font-semibold text-right">${match.home_team}</span>
                            <img src="${match.home_logo}" alt="" class="w-8 h-8 object-contain">
                        </div>
                        <div class="px-4 text-center">
                            <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full font-mono">${match.game_state}</span>
                        </div>
                        <div class="flex items-center gap-4 flex-1 justify-start">
                            <img src="${match.away_logo}" alt="" class="w-8 h-8 object-contain">
                            <span class="font-semibold text-left">${match.away_team}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                loading.classList.add('hidden');
                noMatches.classList.remove('hidden');
            }
        }

        async function fetchPrediction(homeTeam, awayTeam) {
            const modal = document.getElementById('modal');
            const modalTeams = document.getElementById('modal-teams');
            modalTeams.innerText = `${homeTeam} vs ${awayTeam}`;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const playersContainer = document.getElementById('players-container');
            playersContainer.innerHTML = '<div class="text-center py-8 text-slate-400">Analyse des buteurs en cours...</div>';

            try {
                const response = await fetch('/predict/goalscorers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: homeTeam, away_team: awayTeam })
                });
                
                currentMatchData = await response.json();
                renderPlayers();

            } catch (err) {
                playersContainer.innerHTML = '<div class="text-center py-8 text-red-400">Erreur lors de la récupération des données.</div>';
            }
        }

        function switchTab(tab) {
            activeTab = tab;
            const btnHome = document.getElementById('btn-home');
            const btnAway = document.getElementById('btn-away');

            if (tab === 'home') {
                btnHome.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-red-600 text-white transition";
                btnAway.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
            } else {
                btnAway.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-red-600 text-white transition";
                btnHome.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
            }
            renderPlayers();
        }

        function renderPlayers() {
            if (!currentMatchData) return;
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            const players = activeTab === 'home' ? currentMatchData.top_goalscorers_home : currentMatchData.top_goalscorers_away;

            players.forEach(p => {
                const item = document.createElement('div');
                item.className = "bg-slate-950 border border-slate-800/80 rounded-xl p-3.5 flex items-center justify-between";
                item.innerHTML = `
                    <div>
                        <div class="font-bold text-sm text-white flex items-center gap-2">
                            ${p.name} <span class="text-xs bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">${p.pos}</span>
                        </div>
                        <div class="text-xs text-slate-400 mt-0.5">${p.stats} &bull; <span class="text-slate-300">${p.momentum}</span></div>
                    </div>
                    <div class="text-right">
                        <div class="text-red-500 font-bold text-sm">${p.prob}</div>
                        <div class="text-xs text-slate-400">Cote ~${p.odds}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
