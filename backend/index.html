<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-IA Pronostics</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --accent-color: #ff4757; /* Rouge/Orange vif comme sur la capture */
            --accent-hover: #ff6b81;
            --text-color: #ffffff;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --home-color: #2ecc71;
            --draw-color: #f1c40f;
            --away-color: #ff4757;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--text-color);
            margin: 0;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Onglets Sports (Style gros boutons arrondis) */
        .sports-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .sport-btn {
            flex: 1;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95em;
            text-align: center;
            transition: all 0.2s;
        }

        .sport-btn.active {
            background-color: var(--card-bg);
            border-color: var(--accent-color);
            color: var(--text-color);
        }

        /* Calendrier Horizontal type Flashscore */
        .flashscore-calendar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .flashscore-calendar::-webkit-scrollbar {
            display: none;
        }

        .cal-day-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            min-width: 55px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .cal-day-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
        }

        .cal-day-name {
            font-size: 0.7em;
            text-transform: uppercase;
        }

        .cal-day-date {
            font-size: 0.9em;
            margin-top: 2px;
        }

        /* Liste des matchs */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .match-card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.95em;
            font-weight: 500;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .match-score {
            font-weight: bold;
            font-size: 1.05em;
        }

        /* Bouton PRONO rouge/orange */
        .prono-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .prono-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Panneau de résultats du pronostic intégré */
        .prediction-panel {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.85em;
        }

        .pred-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .pred-score-badge {
            background: #21262d;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .prob-bar-bg {
            background-color: #21262d;
            height: 6px;
            border-radius: 3px;
            display: flex;
            overflow: hidden;
            gap: 2px;
            margin: 6px 0 10px 0;
        }

        .prob-segment {
            height: 100%;
        }

        .stats-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .stat-badge {
            background: #161b22;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            flex: 1;
            text-align: center;
            font-size: 0.8em;
            color: var(--text-muted);
        }
        .stat-badge strong {
            color: var(--text-color);
        }

        .players-box {
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
            margin-top: 6px;
        }
        .player-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.78em;
            padding: 2px 0;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Multi-IA Pronostics</h1>
    </header>

    <!-- Onglets Sports -->
    <div class="sports-tabs">
        <button id="btn-tab-nhl" class="sport-btn" onclick="switchSport('nhl', event)">🏒 NHL</button>
        <button id="btn-tab-foot" class="sport-btn active" onclick="switchSport('foot', event)">⚽ Football</button>
    </div>

    <!-- ONGLET FOOTBALL -->
    <div id="sport-foot" class="tab-content active">
        <div id="foot-calendar" class="flashscore-calendar"></div>
        <div id="foot-matches">
            <p style="text-align: center; color: var(--text-muted);">Chargement des matchs...</p>
        </div>
    </div>

    <!-- ONGLET NHL -->
    <div id="sport-nhl" class="tab-content">
        <div id="nhl-calendar" class="flashscore-calendar"></div>
        <div id="nhl-matches">
            <p style="text-align: center; color: var(--text-muted);">Chargement des matchs...</p>
        </div>
    </div>

    <script>
        let selectedFootDate = new Date().toISOString().split('T')[0];
        let selectedNhlDate = new Date().toISOString().split('T')[0];

        function switchSport(sport, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sport-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('sport-' + sport).classList.add('active');
            document.getElementById('btn-tab-' + sport).classList.add('active');
        }

        function buildCalendar(sport) {
            const containerId = sport === 'foot' ? 'foot-calendar' : 'nhl-calendar';
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const today = new Date();
            for (let i = -3; i <= 3; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];

                const dayName = d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '');
                const dayDate = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'numeric' });

                const btn = document.createElement('button');
                btn.className = 'cal-day-btn';
                if (dateStr === (sport === 'foot' ? selectedFootDate : selectedNhlDate)) {
                    btn.classList.add('active');
                }

                btn.innerHTML = `
                    <div class="cal-day-name">${i === 0 ? 'AJD' : dayName}</div>
                    <div class="cal-day-date">${dayDate}</div>
                `;

                btn.onclick = () => {
                    if (sport === 'foot') {
                        selectedFootDate = dateStr;
                        loadFootMatches();
                    } else {
                        selectedNhlDate = dateStr;
                        loadNhlMatches();
                    }
                    buildCalendar(sport);
                };

                container.appendChild(btn);
            }
        }

        async function loadFootMatches() {
            const container = document.getElementById('foot-matches');
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Chargement...</p>';

            try {
                const res = await fetch(`/api/matches/foot?date=${selectedFootDate}`);
                const data = await res.json();
                
                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Aucun match de football trouvé.</p>';
                    return;
                }

                container.innerHTML = '';
                data.matches.forEach((m, index) => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-card-header">
                            <span>FOOTBALL</span>
                            <span>${m.game_state === 'OFF' ? 'TERMINÉ' : 'À VENIR'}</span>
                        </div>
                        <div class="match-row">
                            <div class="team-info">
                                <img src="${m.home_logo || ''}" class="team-logo" onerror="this.style.display='none'">
                                <span>${m.home_team}</span>
                            </div>
                            <span class="match-score">${m.home_score !== null ? m.home_score : '-'}</span>
                        </div>
                        <div class="match-row">
                            <div class="team-info">
                                <img src="${m.away_logo || ''}" class="team-logo" onerror="this.style.display='none'">
                                <span>${m.away_team}</span>
                            </div>
                            <span class="match-score">${m.away_score !== null ? m.away_score : '-'}</span>
                        </div>
                        <button class="prono-btn" onclick="toggleFootProno('${m.home_team}', '${m.away_team}', ${m.home_id || 'null'}, ${m.away_id || 'null'}, 'foot-pred-${index}')">
                            ⚡ PRONO
                        </button>
                        <div id="foot-pred-${index}" style="display:none;"></div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = '<p style="color: #ff4757; text-align: center;">Erreur de chargement.</p>';
            }
        }

        async function toggleFootProno(home, away, homeId, awayId, containerId) {
            const box = document.getElementById(containerId);
            if (box.style.display === 'block') {
                box.style.display = 'none';
                return;
            }

            box.style.display = 'block';
            box.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.85em;">Analyse Multi-IA en cours...</p>';

            try {
                const res = await fetch('/predict/match/foot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: home, away_team: away, home_id: homeId, away_id: awayId })
                });
                const data = await res.json();

                const h = data.probabilities.home_win;
                const d = data.probabilities.draw;
                const a = data.probabilities.away_win;

                box.innerHTML = `
                    <div class="prediction-panel">
                        <div class="pred-header">
                            <strong>1N2 & Probabilités</strong>
                            <div class="pred-score-badge">Score : ${data.predicted_score}</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.8em; font-weight: bold;">
                            <span style="color: var(--home-color);">1: ${h}%</span>
                            <span style="color: var(--draw-color);">X: ${d}%</span>
                            <span style="color: var(--away-color);">2: ${a}%</span>
                        </div>
                        <div class="prob-bar-bg">
                            <div class="prob-segment" style="width: ${h}%; background-color: var(--home-color);"></div>
                            <div class="prob-segment" style="width: ${d}%; background-color: var(--draw-color);"></div>
                            <div class="prob-segment" style="width: ${a}%; background-color: var(--away-color);"></div>
                        </div>
                        <div class="stats-row">
                            <div class="stat-badge">BTTS : <strong>${data.btts.yes_prob}%</strong></div>
                            <div class="stat-badge">Over 2.5 : <strong>${data.over_under_2_5.over_prob}%</strong></div>
                        </div>
                    </div>
                `;
            } catch (err) {
                box.innerHTML = '<p style="color: #ff4757; text-align: center;">Erreur de prédiction.</p>';
            }
        }

        async function loadNhlMatches() {
            const container = document.getElementById('nhl-matches');
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Chargement...</p>';

            try {
                const res = await fetch(`/api/matches/nhl?date=${selectedNhlDate}`);
                const data = await res.json();
                
                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Aucun match NHL trouvé.</p>';
                    return;
                }

                container.innerHTML = '';
                data.matches.forEach((m, index) => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-card-header">
                            <span>LNH / NHL</span>
                            <span>${m.game_state === 'OFF' ? 'TERMINÉ' : m.game_state}</span>
                        </div>
                        <div class="match-row">
                            <div class="team-info">
                                <img src="${m.home_logo || ''}" class="team-logo" onerror="this.style.display='none'">
                                <span>${m.home_team}</span>
                            </div>
                            <span class="match-score">${m.home_score !== null ? m.home_score : '-'}</span>
                        </div>
                        <div class="match-row">
                            <div class="team-info">
                                <img src="${m.away_logo || ''}" class="team-logo" onerror="this.style.display='none'">
                                <span>${m.away_team}</span>
                            </div>
                            <span class="match-score">${m.away_score !== null ? m.away_score : '-'}</span>
                        </div>
                        <button class="prono-btn" onclick="toggleNhlProno('${m.home_team}', '${m.away_team}', 'nhl-pred-${index}')">
                            ⚡ PRONO
                        </button>
                        <div id="nhl-pred-${index}" style="display:none;"></div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = '<p style="color: #ff4757; text-align: center;">Erreur de chargement.</p>';
            }
        }

        async function toggleNhlProno(home, away, containerId) {
            const box = document.getElementById(containerId);
            if (box.style.display === 'block') {
                box.style.display = 'none';
                return;
            }

            box.style.display = 'block';
            box.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.85em;">Analyse LNH en cours...</p>';

            try {
                const res = await fetch('/predict/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: home, away_team: away })
                });
                const data = await res.json();

                const h = data.probabilities.home_win;
                const d = data.probabilities.draw;
                const a = data.probabilities.away_win;

                let playersHtml = '';
                if (data.home_players && data.away_players) {
                    playersHtml = `
                        <div class="players-box">
                            <div style="font-size: 0.78em; font-weight: bold; color: var(--accent-color); margin-bottom: 3px;">🎯 Buteurs & Passeurs Clés</div>
                            <div class="player-line"><span>${data.home_players[0].name} (${data.home_players[0].pos})</span><strong>${data.home_players[0].stats}</strong></div>
                            <div class="player-line"><span>${data.away_players[0].name} (${data.away_players[0].pos})</span><strong>${data.away_players[0].stats}</strong></div>
                        </div>
                    `;
                }

                box.innerHTML = `
                    <div class="prediction-panel">
                        <div class="pred-header">
                            <strong>Victoire / Nul (OT)</strong>
                            <div class="pred-score-badge">Score : ${data.predicted_score}</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.8em; font-weight: bold;">
                            <span style="color: var(--home-color);">1: ${h}%</span>
                            <span style="color: var(--draw-color);">OT: ${d}%</span>
                            <span style="color: var(--away-color);">2: ${a}%</span>
                        </div>
                        <div class="prob-bar-bg">
                            <div class="prob-segment" style="width: ${h}%; background-color: var(--home-color);"></div>
                            <div class="prob-segment" style="width: ${d}%; background-color: var(--draw-color);"></div>
                            <div class="prob-segment" style="width: ${a}%; background-color: var(--away-color);"></div>
                        </div>
                        <div class="stats-row">
                            <div class="stat-badge">Over 5.5 : <strong>${data.over_under_5_5.over_prob}%</strong></div>
                            <div class="stat-badge">Gardiens : <strong>${data.goalies.home.name.split(' ').pop()} vs ${data.goalies.away.name.split(' ').pop()}</strong></div>
                        </div>
                        ${playersHtml}
                    </div>
                `;
            } catch (err) {
                box.innerHTML = '<p style="color: #ff4757; text-align: center;">Erreur de prédiction.</p>';
            }
        }

        window.onload = () => {
            buildCalendar('foot');
            buildCalendar('nhl');
            loadFootMatches();
            loadNhlMatches();
        };
    </script>
</body>
</html>
