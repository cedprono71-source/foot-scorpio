<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-IA NHL & Football Dashboard v19.0</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1e1e2f;
            --accent-color: #4ecca3;
            --accent-hover: #45b393;
            --text-color: #ffffff;
            --text-muted: #a0a0c0;
            --border-color: #2f2f45;
            --home-color: #4ecca3;
            --draw-color: #f39c12;
            --away-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0;
        }

        /* Style des onglets principaux */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-color);
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #0f111a;
            border-color: var(--accent-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--accent-color);
            font-size: 1.3em;
        }

        /* Barre de calendrier rapide */
        .calendar-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            background: var(--bg-color);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .cal-btn {
            background: #25283c;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cal-btn:hover {
            background: var(--border-color);
        }

        input[type="date"] {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            flex-grow: 1;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #0f111a;
            font-weight: bold;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .match-list {
            max-height: 380px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .match-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-item:hover {
            border-color: var(--accent-color);
            background-color: rgba(78, 204, 163, 0.05);
        }

        .match-teams {
            font-weight: 600;
        }

        .match-time {
            font-size: 0.85em;
            color: var(--text-muted);
        }

        .prediction-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .prediction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .prediction-header h3 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.1em;
        }

        .score-badge {
            background: #25283c;
            border: 1px solid var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .prob-container {
            margin-bottom: 15px;
        }

        .prob-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .prob-bar-bg {
            background-color: #2f2f45;
            height: 10px;
            border-radius: 5px;
            display: flex;
            overflow: hidden;
            gap: 2px;
        }

        .prob-segment {
            height: 100%;
            transition: width 0.5s ease;
        }

        .badge-stats {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            color: var(--text-muted);
            flex: 1;
            text-align: center;
        }

        .stat-pill strong {
            color: var(--text-color);
        }

        .multi-ai-card {
            background: #151722;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .ai-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .ai-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏒⚽ Multi-IA Dashboard (v19.0)</h1>
        <p>Moteur de prédiction unifié - Poisson, Machine Learning & Régularité</p>
    </header>

    <!-- Navigation par Onglets -->
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('foot', event)">⚽ Football</button>
        <button class="tab-btn" onclick="switchTab('nhl', event)">🏒 LNH / NHL</button>
    </div>

    <div class="container">
        <!-- ONGLET FOOTBALL -->
        <div id="tab-foot" class="tab-content active">
            <div class="panel">
                <h2>⚽ Calendrier & Matchs de Football</h2>
                <!-- Barre Calendrier Intégrée -->
                <div class="calendar-bar">
                    <button class="cal-btn" onclick="changeDate('foot', -1)">◀ Hier</button>
                    <button class="cal-btn" onclick="changeDate('foot', 0)">Aujourd'hui</button>
                    <button class="cal-btn" onclick="changeDate('foot', 1)">Demain ▶</button>
                    <input type="date" id="foot-date" onchange="loadFootMatches()">
                    <button class="action-btn" onclick="loadFootMatches()">Filtrer</button>
                </div>
                <div id="foot-matches" class="match-list">
                    <p style="color: var(--text-muted); text-align: center;">Sélectionnez une date pour afficher les matchs.</p>
                </div>
                <div id="foot-result" class="prediction-box" style="display:none;"></div>
            </div>
        </div>

        <!-- ONGLET NHL -->
        <div id="tab-nhl" class="tab-content">
            <div class="panel">
                <h2>🏒 Calendrier & Matchs LNH / NHL</h2>
                <!-- Barre Calendrier Intégrée -->
                <div class="calendar-bar">
                    <button class="cal-btn" onclick="changeDate('nhl', -1)">◀ Hier</button>
                    <button class="cal-btn" onclick="changeDate('nhl', 0)">Aujourd'hui</button>
                    <button class="cal-btn" onclick="changeDate('nhl', 1)">Demain ▶</button>
                    <input type="date" id="nhl-date" onchange="loadNhlMatches()">
                    <button class="action-btn" onclick="loadNhlMatches()">Filtrer</button>
                </div>
                <div id="nhl-matches" class="match-list">
                    <p style="color: var(--text-muted); text-align: center;">Sélectionnez une date pour afficher les matchs.</p>
                </div>
                <div id="nhl-result" class="prediction-box" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('foot-date').value = today;
        document.getElementById('nhl-date').value = today;

        // Gestion des onglets
        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Navigation rapide par jour (Calendrier)
        function changeDate(sport, daysOffset) {
            const inputId = sport === 'foot' ? 'foot-date' : 'nhl-date';
            const dateInput = document.getElementById(inputId);
            
            let currentDate = dateInput.value ? new Date(dateInput.value) : new Date();
            
            if (daysOffset === 0) {
                currentDate = new Date();
            } else {
                currentDate.setDate(currentDate.getDate() + daysOffset);
            }

            dateInput.value = currentDate.toISOString().split('T')[0];

            if (sport === 'foot') {
                loadFootMatches();
            } else {
                loadNhlMatches();
            }
        }

        async function loadFootMatches() {
            const date = document.getElementById('foot-date').value;
            const container = document.getElementById('foot-matches');
            container.innerHTML = '<p style="text-align: center;">Chargement...</p>';

            try {
                const res = await fetch(`/api/matches/foot?date=${date}`);
                const data = await res.json();
                
                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Aucun match trouvé pour cette date.</p>';
                    return;
                }

                container.innerHTML = '';
                data.matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'match-item';
                    div.innerHTML = `
                        <div class="match-teams">${m.home_team} vs ${m.away_team}</div>
                        <div class="match-time">${m.game_state === 'OFF' ? 'Terminé' : 'À venir'}</div>
                    `;
                    div.onclick = () => predictFootMatch(m.home_team, m.away_team, m.home_id, m.away_id);
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Erreur de chargement des matchs.</p>';
            }
        }

        async function predictFootMatch(home, away, homeId, awayId) {
            const resultBox = document.getElementById('foot-result');
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p style="text-align: center;">Analyse Multi-IA en cours...</p>';

            try {
                const res = await fetch('/predict/match/foot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: home, away_team: away, home_id: homeId, away_id: awayId })
                });
                const data = await res.json();

                const hProb = data.probabilities.home_win;
                const dProb = data.probabilities.draw;
                const aProb = data.probabilities.away_win;

                let consensusHtml = '';
                if (data.multi_ai_consensus) {
                    const conf = data.multi_ai_consensus.confidence_score;
                    const ai1 = data.multi_ai_consensus.ai_1_poisson;
                    const ai2 = data.multi_ai_consensus.ai_2_trends;
                    const ai3 = data.multi_ai_consensus.ai_3_streak;
                    
                    consensusHtml = `
                        <div class="multi-ai-card">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <strong style="color: var(--accent-color);">🧠 Consensus Multi-IA</strong>
                                <span style="font-size: 0.85em; background: rgba(78,204,163,0.1); color: var(--accent-color); padding: 2px 8px; border-radius: 4px;">Confiance : ${conf}</span>
                            </div>
                            <div class="ai-row">
                                <span>IA 1 (Poisson / xG - 50%)</span>
                                <span>1: <strong>${ai1.home}%</strong> | X: <strong>${ai1.draw}%</strong> | 2: <strong>${ai1.away}%</strong></span>
                            </div>
                            <div class="ai-row">
                                <span>IA 2 (Machine Learning - 30%)</span>
                                <span>1: <strong>${ai2.home}%</strong> | X: <strong>${ai2.draw}%</strong> | 2: <strong>${ai2.away}%</strong></span>
                            </div>
                            <div class="ai-row">
                                <span>IA 3 (Régularité - 20%)</span>
                                <span>1: <strong>${ai3.home}%</strong> | X: <strong>${ai3.draw}%</strong> | 2: <strong>${ai3.away}%</strong></span>
                            </div>
                        </div>
                    `;
                }

                resultBox.innerHTML = `
                    <div class="prediction-header">
                        <h3>${data.match}</h3>
                        <div class="score-badge">Score : ${data.predicted_score}</div>
                    </div>

                    <div class="prob-container">
                        <div class="prob-labels">
                            <span style="color: var(--home-color);">Domicile (${hProb}%)</span>
                            <span style="color: var(--draw-color);">Nul (${dProb}%)</span>
                            <span style="color: var(--away-color);">Extérieur (${aProb}%)</span>
                        </div>
                        <div class="prob-bar-bg">
                            <div class="prob-segment" style="width: ${hProb}%; background-color: var(--home-color);"></div>
                            <div class="prob-segment" style="width: ${dProb}%; background-color: var(--draw-color);"></div>
                            <div class="prob-segment" style="width: ${aProb}%; background-color: var(--away-color);"></div>
                        </div>
                    </div>

                    <div class="badge-stats">
                        <div class="stat-pill">Over 2.5 : <strong>${data.over_under_2_5.over_prob}%</strong></div>
                        <div class="stat-pill">BTTS : <strong>${data.btts.yes_prob}%</strong></div>
                    </div>

                    ${consensusHtml}
                `;
            } catch (err) {
                resultBox.innerHTML = '<p style="color: #ff6b6b;">Erreur lors du calcul de la prédiction.</p>';
            }
        }

        async function loadNhlMatches() {
            const date = document.getElementById('nhl-date').value;
            const container = document.getElementById('nhl-matches');
            container.innerHTML = '<p style="text-align: center;">Chargement...</p>';

            try {
                const res = await fetch(`/api/matches/nhl?date=${date}`);
                const data = await res.json();
                
                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Aucun match NHL trouvé pour cette date.</p>';
                    return;
                }

                container.innerHTML = '';
                data.matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'match-item';
                    div.innerHTML = `
                        <div class="match-teams">${m.home_team} vs ${m.away_team}</div>
                        <div class="match-time">${m.game_state}</div>
                    `;
                    div.onclick = () => predictNhlMatch(m.home_team, m.away_team);
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Erreur de chargement.</p>';
            }
        }

        async function predictNhlMatch(home, away) {
            const resultBox = document.getElementById('nhl-result');
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p style="text-align: center;">Analyse LNH en cours...</p>';

            try {
                const res = await fetch('/predict/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: home, away_team: away })
                });
                const data = await res.json();

                const hProb = data.probabilities.home_win;
                const dProb = data.probabilities.draw;
                const aProb = data.probabilities.away_win;

                resultBox.innerHTML = `
                    <div class="prediction-header">
                        <h3>${data.match}</h3>
                        <div class="score-badge">Score : ${data.predicted_score}</div>
                    </div>

                    <div class="prob-container">
                        <div class="prob-labels">
                            <span style="color: var(--home-color);">Domicile (${hProb}%)</span>
                            <span style="color: var(--draw-color);">Nul/OT (${dProb}%)</span>
                            <span style="color: var(--away-color);">Extérieur (${aProb}%)</span>
                        </div>
                        <div class="prob-bar-bg">
                            <div class="prob-segment" style="width: ${hProb}%; background-color: var(--home-color);"></div>
                            <div class="prob-segment" style="width: ${dProb}%; background-color: var(--draw-color);"></div>
                            <div class="prob-segment" style="width: ${aProb}%; background-color: var(--away-color);"></div>
                        </div>
                    </div>

                    <div class="badge-stats">
                        <div class="stat-pill">Over 5.5 : <strong>${data.over_under_5_5.over_prob}%</strong></div>
                        <div class="stat-pill">Gardien : <strong>${data.goalies.home.name.split(' ').pop()} vs ${data.goalies.away.name.split(' ').pop()}</strong></div>
                    </div>
                `;
            } catch (err) {
                resultBox.innerHTML = '<p style="color: #ff6b6b;">Erreur de prédiction.</p>';
            }
        }

        window.onload = () => {
            loadFootMatches();
            loadNhlMatches();
        };
    </script>
</body>
</html>
