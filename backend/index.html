<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-IA Pronostics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .sport-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .sport-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            background-color: #1e293b;
            color: #94a3b8;
            transition: all 0.2s;
        }
        .sport-btn.active-nhl {
            background-color: #3b82f6;
            color: white;
        }
        .sport-btn.active-foot {
            background-color: #ef4444;
            color: white;
        }
        .date-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .date-strip::-webkit-scrollbar {
            display: none;
        }
        .date-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            min-width: 70px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.85rem;
        }
        .date-btn.active {
            background-color: #334155;
            color: white;
            border: 1px solid #ef4444;
        }
        .date-btn.active-nhl-date {
            border: 1px solid #3b82f6;
        }
        .date-btn span.day {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .section-title {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .match-card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .match-teams {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1rem;
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .match-footer {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
        .prono-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .prono-btn.nhl-prono {
            background-color: #3b82f6;
        }
        .no-matches {
            text-align: center;
            color: #64748b;
            padding: 40px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ Multi-IA Pronostics</h1>

    <!-- Sélecteur de Sport -->
    <div class="sport-selector">
        <button id="btn-nhl" class="sport-btn" onclick="switchSport('nhl')">🏒 NHL</button>
        <button id="btn-foot" class="sport-btn active-foot" onclick="switchSport('foot')">⚽ Football</button>
    </div>

    <!-- Sélecteur de Date -->
    <div class="date-strip" id="date-strip">
        <!-- Généré dynamiquement en JS -->
    </div>

    <div class="section-title" id="section-title">MATCHS FOOTBALL</div>

    <!-- Liste des Matchs -->
    <div class="matches-list" id="matches-list">
        <div class="no-matches">Chargement des matchs...</div>
    </div>
</div>

<!-- Fenêtre Modale de Pronostic Stylisée -->
<div id="prono-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 16px;">
    <div style="background-color: #1e293b; width: 100%; max-width: 440px; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; border: 1px solid #334155;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="modal-title" style="font-size: 1.1rem; color: #f8fafc;">Pronostic</h3>
            <button onclick="closeModal()" style="background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer;">&times;</button>
        </div>
        <div id="modal-body" style="display: flex; flex-direction: column; gap: 14px; font-size: 0.9rem; color: #cbd5e1;">
            <!-- Contenu dynamique -->
        </div>
        <button onclick="closeModal()" style="background-color: #3b82f6; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 4px;">Fermer</button>
    </div>
</div>

<script>
    let currentSport = 'foot';
    let selectedDate = new Date().toISOString().split('T')[0];

    function initDates() {
        const strip = document.getElementById('date-strip');
        strip.innerHTML = '';
        
        for (let i = -7; i <= 30; i++) {
            const d = new Date();
            d.setDate(d.getDate() + i);
            const dateStr = d.toISOString().split('T')[0];
            
            const options = { weekday: 'short', day: 'numeric', month: 'numeric' };
            const formatted = d.toLocaleDateString('fr-FR', options);
            const parts = formatted.split(' ');

            const btn = document.createElement('button');
            let activeClass = dateStr === selectedDate ? 'active' : '';
            if (dateStr === selectedDate && currentSport === 'nhl') {
                activeClass += ' active-nhl-date';
            }
            btn.className = `date-btn ${activeClass}`;
            btn.innerHTML = `<span class="day">${parts[0] || ''}</span><span>${parts[1] || dateStr}</span>`;
            btn.onclick = () => {
                selectedDate = dateStr;
                initDates();
                loadMatches();
            };
            strip.appendChild(btn);
        }
    }

    function switchSport(sport) {
        currentSport = sport;
        const btnNhl = document.getElementById('btn-nhl');
        const btnFoot = document.getElementById('btn-foot');
        const title = document.getElementById('section-title');

        if (sport === 'nhl') {
            btnNhl.className = 'sport-btn active-nhl';
            btnFoot.className = 'sport-btn';
            title.innerText = 'MATCHS NHL DU ' + selectedDate;
        } else {
            btnNhl.className = 'sport-btn';
            btnFoot.className = 'sport-btn active-foot';
            title.innerText = 'MATCHS FOOTBALL DU ' + selectedDate;
        }
        initDates();
        loadMatches();
    }

    function openPrediction(home, away, homeId, awayId) {
        const endpoint = currentSport === 'foot' ? '/predict/match/foot' : '/predict/match';
        const bodyData = currentSport === 'foot' 
            ? { home_team: home, away_team: away, home_id: homeId, away_id: awayId }
            : { home_team: home, away_team: away };
        
        document.getElementById('modal-title').innerText = `Analyse IA en cours...`;
        document.getElementById('modal-body').innerHTML = `<div style="text-align: center; padding: 20px; color: #94a3b8;">Calcul des probabilités et des effectifs...</div>`;
        document.getElementById('prono-modal').style.display = 'flex';

        fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyData)
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('modal-title').innerText = `⚡ PRONOSTIC ${currentSport.toUpperCase()}`;
            
            let playersHtml = '';
            if (data.home_players && data.away_players) {
                const renderPlayers = (title, list) => `
                    <div style="background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 6px;">
                        <div style="font-weight: bold; color: #38bdf8; margin-bottom: 6px; font-size: 0.85rem;">⭐ ${title}</div>
                        ${list.map(p => `
                            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; padding: 3px 0; border-bottom: 1px solid #1e293b;">
                                <span>${p.name} <span style="color:#64748b">(${p.pos})</span></span>
                                <span style="font-weight: 600;">${p.stats} <span style="color: #10b981;">[${p.pct}%]</span></span>
                            </div>
                        `).join('')}
                    </div>
                `;
                playersHtml = renderPlayers(home, data.home_players) + renderPlayers(away, data.away_players);
            }

            let contentHtml = '';
            if (currentSport === 'foot') {
                contentHtml = `
                    <div style="font-weight: bold; font-size: 1rem; color: white; text-align: center; margin-bottom: 4px;">${data.match}</div>
                    <div style="display: flex; justify-content: space-around; background: #0f172a; padding: 12px; border-radius: 10px; text-align: center;">
                        <div><div style="font-size:0.75rem; color:#94a3b8">SCORE ESTIMÉ</div><div style="font-size:1.2rem; font-weight:bold; color:#f59e0b;">${data.predicted_score}</div></div>
                        <div><div style="font-size:0.75rem; color:#94a3b8">OVER 2.5 BUTS</div><div style="font-size:1.2rem; font-weight:bold; color:#38bdf8;">${data.over_under_2_5.over_prob}%</div></div>
                    </div>
                    <div>
                        <div style="font-weight:bold; margin-bottom:6px; color:#f8fafc;">📊 Probabilités 1N2 :</div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <div style="display:flex; justify-content:space-between;"><span>1 (${home}) :</span> <b>${data.probabilities.home_win}%</b></div>
                            <div style="display:flex; justify-content:space-between;"><span>N (Nul) :</span> <b>${data.probabilities.draw}%</b></div>
                            <div style="display:flex; justify-content:space-between;"><span>2 (${away}) :</span> <b>${data.probabilities.away_win}%</b></div>
                        </div>
                    </div>
                    ${playersHtml}
                `;
            } else {
                contentHtml = `
                    <div style="font-weight: bold; font-size: 1rem; color: white; text-align: center; margin-bottom: 4px;">${data.match}</div>
                    <div style="display: flex; justify-content: space-around; background: #0f172a; padding: 12px; border-radius: 10px; text-align: center;">
                        <div><div style="font-size:0.75rem; color:#94a3b8">SCORE ESTIMÉ</div><div style="font-size:1.2rem; font-weight:bold; color:#f59e0b;">${data.predicted_score}</div></div>
                        <div><div style="font-size:0.75rem; color:#94a3b8">OVER 5.5</div><div style="font-size:1.2rem; font-weight:bold; color:#38bdf8;">${data.over_under_5_5.over_prob}%</div></div>
                    </div>
                    <div>
                        <div style="font-weight:bold; margin-bottom:6px; color:#f8fafc;">📊 Probabilités de Victoire :</div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>${home} : <b>${data.probabilities.home_win}%</b></span>
                            <span>${away} : <b>${data.probabilities.away_win}%</b></span>
                        </div>
                    </div>
                    ${playersHtml}
                `;
            }

            document.getElementById('modal-body').innerHTML = contentHtml;
        })
        .catch(() => {
            document.getElementById('modal-body').innerHTML = `<div style="color: #ef4444; text-align: center; padding: 20px;">Erreur lors du chargement des prédictions.</div>`;
        });
    }

    function closeModal() {
        document.getElementById('prono-modal').style.display = 'none';
    }

    function loadMatches() {
        const list = document.getElementById('matches-list');
        list.innerHTML = '<div class="no-matches">Chargement en cours...</div>';

        const endpoint = currentSport === 'nhl' 
            ? `/api/matches/nhl?date=${selectedDate}` 
            : `/api/matches/foot?date=${selectedDate}`;

        fetch(endpoint)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                const matches = data.matches || [];

                if (matches.length === 0) {
                    list.innerHTML = '<div class="no-matches">Aucun match officiel programmé ce jour.</div>';
                    return;
                }

                matches.forEach(m => {
                    const timeStr = m.time ? new Date(m.time).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}) : '--:--';
                    
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-header">
                            <span>${currentSport.toUpperCase()}</span>
                            <span>${m.game_state === 'OFF' ? 'TERMINÉ' : timeStr}</span>
                        </div>
                        <div class="match-teams">
                            <div class="team-row">
                                <div class="team-info">
                                    ${m.home_logo ? `<img src="${m.home_logo}" class="team-logo">` : ''}
                                    <span>${m.home_team}</span>
                                </div>
                                <span>${m.home_score !== null && m.home_score !== undefined ? m.home_score : ''}</span>
                            </div>
                            <div class="team-row">
                                <div class="team-info">
                                    ${m.away_logo ? `<img src="${m.away_logo}" class="team-logo">` : ''}
                                    <span>${m.away_team}</span>
                                </div>
                                <span>${m.away_score !== null && m.away_score !== undefined ? m.away_score : ''}</span>
                            </div>
                        </div>
                        <div class="match-footer">
                            <button class="prono-btn ${currentSport === 'nhl' ? 'nhl-prono' : ''}">⚡ PRONO</button>
                        </div>
                    `;
                    
                    card.querySelector('.prono-btn').onclick = () => openPrediction(m.home_team, m.away_team, m.home_id, m.away_id);
                    list.appendChild(card);
                });
            })
            .catch(() => {
                list.innerHTML = '<div class="no-matches">Erreur de chargement des données.</div>';
            });
    }

    // Initialisation au chargement
    initDates();
    loadMatches();
</script>

</body>
</html>
