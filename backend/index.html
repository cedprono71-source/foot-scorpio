<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Sports GoalScorer Analytics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- En-tête -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold tracking-wider text-red-500 flex items-center gap-2">
                ⚽🏒 <span class="text-white">GoalScorer Analytics</span>
            </h1>
            
            <!-- Sélecteur de Sport / Ligue -->
            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button id="tab-nhl" onclick="switchLeague('NHL')" class="px-4 py-1.5 text-xs font-semibold rounded-lg bg-red-600 text-white transition">NHL (Hockey)</button>
                <button id="tab-foot" onclick="switchLeague('FOOT')" class="px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">Football</button>
            </div>

            <!-- Sélecteur de date (Visible uniquement pour la NHL) -->
            <input type="date" id="date-picker" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-red-500">
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6">
        <div id="loading" class="text-center py-12 text-slate-400">Chargement des matchs...</div>
        <div id="matches-container" class="space-y-4"></div>
        <div id="no-matches" class="hidden text-center py-12 text-slate-500">Aucun match trouvé pour cette sélection.</div>
    </main>

    <!-- Modale de Prédiction (Buteurs) -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            
            <!-- Modal Header -->
            <div class="p-4 bg-slate-800/50 border-b border-slate-800 flex justify-between items-center">
                <div id="modal-teams" class="font-bold text-lg text-white">Analyse du Match</div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold px-2">&times;</button>
            </div>

            <!-- Modal Body -->
            <div class="p-4 flex-1 overflow-y-auto space-y-4">
                <!-- Boutons Domicile / Extérieur -->
                <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button id="btn-home" onclick="switchModalTab('home')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-red-600 text-white transition">Domicile</button>
                    <button id="btn-away" onclick="switchModalTab('away')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition">Extérieur</button>
                </div>

                <!-- Conteneur des joueurs -->
                <div id="players-container" class="space-y-3"></div>
            </div>

        </div>
    </div>

    <!-- Script JavaScript Front-End -->
    <script>
        let currentLeague = 'NHL';
        let currentMatchData = null;
        let activeModalTab = 'home';

        const todayStr = new Date().toISOString().split('T')[0];
        const datePicker = document.getElementById('date-picker');
        datePicker.value = todayStr;

        datePicker.addEventListener('change', (e) => {
            if (currentLeague === 'NHL') loadNhlMatches(e.target.value);
        });

        // Matchs de foot simulés / par défaut pour la démo locale
        const sampleFootMatches = [
            { home_team: "Real Madrid", away_team: "FC Barcelone", game_state: "21:00" },
            { home_team: "Manchester City", away_team: "Arsenal", game_state: "18:30" },
            { home_team: "Paris SG", away_team: "Marseille", game_state: "20:45" },
            { home_team: "Bayern Munich", away_team: "Borussia Dortmund", game_state: "17:30" }
        ];

        loadNhlMatches(todayStr);

        function switchLeague(league) {
            currentLeague = league;
            const tabNhl = document.getElementById('tab-nhl');
            const tabFoot = document.getElementById('tab-foot');
            const dateInput = document.getElementById('date-picker');

            if (league === 'NHL') {
                tabNhl.className = "px-4 py-1.5 text-xs font-semibold rounded-lg bg-red-600 text-white transition";
                tabFoot.className = "px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
                dateInput.style.display = "block";
                loadNhlMatches(datePicker.value);
            } else {
                tabFoot.className = "px-4 py-1.5 text-xs font-semibold rounded-lg bg-red-600 text-white transition";
                tabNhl.className = "px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
                dateInput.style.display = "none";
                loadFootMatches();
            }
        }

        async function loadNhlMatches(date) {
            const container = document.getElementById('matches-container');
            const loading = document.getElementById('loading');
            const noMatches = document.getElementById('no-matches');

            loading.classList.remove('hidden');
            container.innerHTML = '';
            noMatches.classList.add('hidden');

            try {
                const response = await fetch(`/api/matches/nhl?date=${date}`);
                const data = await response.json();
                loading.classList.add('hidden');

                if (!data.matches || data.matches.length === 0) {
                    noMatches.classList.remove('hidden');
                    return;
                }

                data.matches.forEach(match => {
                    renderMatchCard(container, match.home_team, match.away_team, match.home_logo, match.away_logo, match.game_state, 'NHL');
                });
            } catch (err) {
                loading.classList.add('hidden');
                noMatches.classList.remove('hidden');
            }
        }

        function loadFootMatches() {
            const container = document.getElementById('matches-container');
            const loading = document.getElementById('loading');
            const noMatches = document.getElementById('no-matches');

            loading.classList.add('hidden');
            container.innerHTML = '';
            noMatches.classList.add('hidden');

            sampleFootMatches.forEach(match => {
                renderMatchCard(container, match.home_team, match.away_team, '', '', match.game_state, 'FOOT');
            });
        }

        function renderMatchCard(container, home, away, homeLogo, awayLogo, state, league) {
            const card = document.createElement('div');
            card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between hover:border-slate-700 transition cursor-pointer";
            card.onclick = () => fetchPrediction(league, home, away);

            const hLogo = homeLogo || "https://media.api-sports.io/football/teams/default.png";
            const aLogo = awayLogo || "https://media.api-sports.io/football/teams/default.png";

            card.innerHTML = `
                <div class="flex items-center gap-3 flex-1 justify-end">
                    <span class="font-semibold text-right text-sm sm:text-base">${home}</span>
                    <img src="${hLogo}" alt="" class="w-7 h-7 object-contain">
                </div>
                <div class="px-3 text-center">
                    <span class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded-full font-mono">${state}</span>
                </div>
                <div class="flex items-center gap-3 flex-1 justify-start">
                    <img src="${aLogo}" alt="" class="w-7 h-7 object-contain">
                    <span class="font-semibold text-left text-sm sm:text-base">${away}</span>
                </div>
            `;
            container.appendChild(card);
        }

        async function fetchPrediction(league, homeTeam, awayTeam) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-teams').innerText = `${homeTeam} vs ${awayTeam}`;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const playersContainer = document.getElementById('players-container');
            playersContainer.innerHTML = '<div class="text-center py-8 text-slate-400">Calcul des probabilités buteurs...</div>';

            try {
                const response = await fetch('/predict/goalscorers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ league: league, home_team: homeTeam, away_team: awayTeam })
                });
                
                currentMatchData = await response.json();
                renderPlayers();
            } catch (err) {
                playersContainer.innerHTML = '<div class="text-center py-8 text-red-400">Erreur lors de la récupération des données.</div>';
            }
        }

        function switchModalTab(tab) {
            activeModalTab = tab;
            const btnHome = document.getElementById('btn-home');
            const btnAway = document.getElementById('btn-away');

            if (tab === 'home') {
                btnHome.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-red-600 text-white transition";
                btnAway.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
            } else {
                btnAway.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-red-600 text-white transition";
                btnHome.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
            }
            renderPlayers();
        }

        function renderPlayers() {
            if (!currentMatchData) return;
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            const players = activeModalTab === 'home' ? currentMatchData.top_goalscorers_home : currentMatchData.top_goalscorers_away;

            players.forEach(p => {
                const item = document.createElement('div');
                item.className = "bg-slate-950 border border-slate-800/80 rounded-xl p-3.5 flex items-center justify-between";
                item.innerHTML = `
                    <div>
                        <div class="font-bold text-sm text-white flex items-center gap-2">
                            ${p.name} <span class="text-xs bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">${p.pos}</span>
                        </div>
                        <div class="text-xs text-slate-400 mt-0.5">${p.stats} &bull; <span class="text-slate-300">${p.momentum}</span></div>
                    </div>
                    <div class="text-right">
                        <div class="text-red-500 font-bold text-sm">${p.prob}</div>
                        <div class="text-xs text-slate-400">Cote ~${p.odds}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }
    </script>
</body>
</html>
