<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pronostics Multi-IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .prediction-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            border-left: 4px solid #3b82f6;
        }
        .prediction-section h4 {
            margin: 0 0 6px 0;
            font-size: 0.95rem;
            font-weight: bold;
            color: #60a5fa;
        }
        .badge-conseil {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 5px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- En-tête -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl shadow-lg">
            <h1 class="text-2xl font-bold text-emerald-400 mb-2 md:mb-0">⚽🏒 Dashboard Pronostics Multi-IA</h1>
            <div class="flex items-center gap-3">
                <label for="matchDate" class="text-sm font-medium">Date :</label>
                <input type="date" id="matchDate" class="bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-400">
                <button onclick="loadMatches()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-lg font-medium transition">Actualiser</button>
            </div>
        </header>

        <!-- Sélecteur de Sport -->
        <div class="flex gap-2 mb-6">
            <button onclick="switchSport('foot')" id="btnFoot" class="flex-1 py-2.5 rounded-lg font-bold bg-emerald-600 text-white transition">Football (ESPN)</button>
            <button onclick="switchSport('nhl')" id="btnNhl" class="flex-1 py-2.5 rounded-lg font-bold bg-slate-800 text-slate-400 transition">Hockey (NHL)</button>
        </div>

        <!-- Contenu Principal -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Liste des Matchs -->
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-lg font-semibold mb-4 text-slate-200 border-b border-slate-700 pb-2">Matchs du jour</h2>
                <div id="matchesList" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                    <p class="text-slate-400 text-center py-6">Chargement des matchs...</p>
                </div>
            </div>

            <!-- Fenêtre de Pronostic / Analyse -->
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex flex-col">
                <h2 class="text-lg font-semibold mb-4 text-slate-200 border-b border-slate-700 pb-2">Analyse & Pronostic</h2>
                <div id="predictionContent" class="flex-1 flex flex-col justify-center items-center text-center text-slate-400 p-4">
                    <p>Sélectionnez un match dans la liste pour afficher l'analyse détaillée des 5 IA.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSport = 'foot';

        // Initialiser la date du jour au format YYYY-MM-DD
        document.getElementById('matchDate').valueAsDate = new Date();

        function switchSport(sport) {
            currentSport = sport;
            if (sport === 'foot') {
                document.getElementById('btnFoot').className = "flex-1 py-2.5 rounded-lg font-bold bg-emerald-600 text-white transition";
                document.getElementById('btnNhl').className = "flex-1 py-2.5 rounded-lg font-bold bg-slate-800 text-slate-400 transition";
            } else {
                document.getElementById('btnNhl').className = "flex-1 py-2.5 rounded-lg font-bold bg-emerald-600 text-white transition";
                document.getElementById('btnFoot').className = "flex-1 py-2.5 rounded-lg font-bold bg-slate-800 text-slate-400 transition";
            }
            loadMatches();
        }

        async function loadMatches() {
            const dateVal = document.getElementById('matchDate').value;
            const container = document.getElementById('matchesList');
            container.innerHTML = `<p class="text-slate-400 text-center py-6">Recherche des matchs...</p>`;

            try {
                const endpoint = currentSport === 'foot' ? `/api/matches/foot?date=${dateVal}` : `/api/matches/nhl?date=${dateVal}`;
                const res = await fetch(endpoint);
                const data = await res.json();

                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = `<p class="text-slate-400 text-center py-6">Aucun match trouvé pour cette date.</p>`;
                    return;
                }

                container.innerHTML = '';
                data.matches.forEach(match => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-700/50 hover:bg-slate-700 p-3 rounded-lg border border-slate-600 cursor-pointer transition flex justify-between items-center";
                    
                    const scoreText = (match.home_score !== null && match.away_score !== null) 
                        ? `${match.home_score} - ${match.away_score}` 
                        : match.game_state;

                    card.innerHTML = `
                        <div class="flex-1 text-right font-medium text-sm truncate pr-2">${match.home_team}</div>
                        <div class="px-3 py-1 bg-slate-800 rounded text-xs font-bold text-emerald-400 whitespace-nowrap">${scoreText}</div>
                        <div class="flex-1 text-left font-medium text-sm truncate pl-2">${match.away_team}</div>
                    `;

                    card.onclick = () => getPrediction(match.home_team, match.away_team);
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<p class="text-red-400 text-center py-6">Erreur de chargement des matchs.</p>`;
            }
        }

        async function getPrediction(home, away) {
            const container = document.getElementById('predictionContent');
            container.innerHTML = `<p class="text-slate-400">Analyse en cours par le consensus 5-IA...</p>`;

            try {
                const endpoint = currentSport === 'foot' ? '/predict/match/foot' : '/predict/match';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: home, away_team: away })
                });
                const data = await res.json();

                if (currentSport === 'foot') {
                    container.innerHTML = `
                        <div class="text-left w-full space-y-3 text-sm">
                            <h3 class="font-bold text-base text-center text-emerald-400 mb-2">${data.match}</h3>
                            
                            <div class="bg-slate-900/40 p-3 rounded-lg border border-slate-700">
                                <p class="text-center font-semibold mb-1">Score Prédit : <span class="text-emerald-400 text-lg">${data.predicted_score}</span></p>
                                <div class="flex justify-around text-xs text-slate-300 mt-2">
                                    <span>Domicile : ${data.probabilities.home_win}%</span>
                                    <span>Nul : ${data.probabilities.draw}%</span>
                                    <span>Extérieur : ${data.probabilities.away_win}%</span>
                                </div>
                            </div>

                            <!-- Bloc 1ère Mi-temps -->
                            <div class="prediction-section">
                                <h4>⏱️ 1ère Mi-Temps</h4>
                                <p><strong>Score HT estimé :</strong> ${data.first_half.predicted_ht_score}</p>
                                <p><strong>Probabilité But MT (>0.5) :</strong> ${data.first_half.over_0_5_prob}%</p>
                                <p class="badge-conseil">${data.first_half.action_conseillee}</p>
                            </div>

                            <!-- Bloc Cartons Jaunes -->
                            <div class="prediction-section">
                                <h4>🟨 Cartons Jaunes</h4>
                                <p><strong>Total attendu :</strong> ${data.yellow_cards.expected_total} cartons</p>
                                <p><strong>Probabilité > 4.5 cartons :</strong> ${data.yellow_cards.over_4_5_prob}%</p>
                                <p style="font-size: 0.85em; opacity: 0.8; margin-top: 4px;">
                                    Moyenne Domicile : ${data.yellow_cards.home_team_avg} | Extérieur : ${data.yellow_cards.away_team_avg}
                                </p>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="text-left w-full space-y-3 text-sm">
                            <h3 class="font-bold text-base text-center text-emerald-400 mb-2">${data.match}</h3>
                            <p class="text-center font-semibold">Score Prédit : <span class="text-emerald-400">${data.predicted_score}</span></p>
                            <p><strong>Over 5.5 buts :</strong> ${data.over_under_5_5.over_prob}%</p>
                        </div>
                    `;
                }
            } catch (err) {
                container.innerHTML = `<p class="text-red-400">Erreur lors de la génération du pronostic.</p>`;
            }
        }

        // Charger les matchs au démarrage
        loadMatches();
    </script>
</body>
</html>
