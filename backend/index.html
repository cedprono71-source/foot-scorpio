<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL IA Pronostics</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #ef4444;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--text-color);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab.active {
            background-color: var(--accent-color);
            color: white;
        }

        .dates-bar {
            display: flex;
            justify-content: space-between;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .date-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            text-align: center;
            cursor: pointer;
            min-width: 45px;
            flex-shrink: 0;
        }

        .date-item.active {
            border-color: var(--accent-color);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .date-item .day {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .date-item .num {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .team-row img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .match-action {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .time-badge {
            background-color: var(--border-color);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .prono-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            background-color: rgba(239, 68, 68, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .no-matches {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏒 NHL IA Pronostics</h1>
        </header>

        <div class="tabs">
            <div class="tab active" id="tabNhl" onclick="switchTab('nhl')">🏒 NHL</div>
            <div class="tab" id="tabFoot" onclick="switchTab('foot')">⚽ Football</div>
        </div>

        <div class="dates-bar" id="datesBar">
            <!-- Généré dynamiquement par JS -->
        </div>

        <div id="sectionTitle" class="section-title">MATCHS DU JOUR</div>
        
        <div id="matchesContainer">
            <div class="no-matches">Chargement des matchs...</div>
        </div>
    </div>

    <script>
        let currentSport = 'nhl';
        let selectedDate = new Date().toISOString().split('T')[0];

        function initDatesBar() {
            const bar = document.getElementById('datesBar');
            bar.innerHTML = '';
            
            for (let i = -3; i <= 3; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                
                const daysOfWeek = ['DI', 'LU', 'MA', 'ME', 'JE', 'VE', 'SA'];
                const dayName = i === 0 ? 'AJD' : daysOfWeek[d.getDay()];
                const dayNum = `${d.getDate()}.${d.getMonth() + 1}.`;

                const item = document.createElement('div');
                item.className = `date-item ${dateStr === selectedDate ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="day">${dayName}</div>
                    <div class="num">${dayNum}</div>
                `;
                item.onclick = () => {
                    selectedDate = dateStr;
                    initDatesBar();
                    loadMatches();
                };
                bar.appendChild(item);
            }
        }

        function switchTab(sport) {
            currentSport = sport;
            document.getElementById('tabNhl').className = `tab ${sport === 'nhl' ? 'active' : ''}`;
            document.getElementById('tabFoot').className = `tab ${sport === 'foot' ? 'active' : ''}`;
            loadMatches();
        }

        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            const titleEl = document.getElementById('sectionTitle');
            
            titleEl.innerText = currentSport === 'nhl' ? `MATCHS DU ${selectedDate}` : "SECTION FOOTBALL";
            container.innerHTML = `<div class="no-matches">Chargement...</div>`;

            if (currentSport === 'foot') {
                container.innerHTML = `<div class="no-matches">Aucun match de football disponible pour le moment.</div>`;
                return;
            }

            try {
                const response = await fetch(`/api/matches/nhl?date=${selectedDate}`);
                const data = await response.json();
                
                container.innerHTML = '';

                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = `<div class="no-matches">Aucun match prévu à cette date.</div>`;
                    return;
                }

                data.matches.forEach(m => {
                    let timeFormatted = "À venir";
                    if (m.time) {
                        const dateObj = new Date(m.time);
                        timeFormatted = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }

                    let actionHtml = '';
                    if (m.game_state === "OFF" || m.game_state === "FINAL") {
                        actionHtml = `<div class="score-display">${m.home_score} - ${m.away_score}</div>`;
                    } else {
                        actionHtml = `
                            <div class="time-badge">${timeFormatted}</div>
                            <button class="prono-btn" onclick="alert('Prédiction pour ${m.home_team} vs ${m.away_team}')">⚡ PRONO</button>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="team-info">
                            <div class="team-row">
                                <img src="${m.home_logo}" alt="" onerror="this.style.display='none'">
                                <span>${m.home_team}</span>
                            </div>
                            <div class="team-row">
                                <img src="${m.away_logo}" alt="" onerror="this.style.display='none'">
                                <span>${m.away_team}</span>
                            </div>
                        </div>
                        <div class="match-action">
                            ${actionHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = `<div class="no-matches">Erreur lors du chargement des matchs.</div>`;
            }
        }

        // Initialisation au chargement de la page
        initDatesBar();
        loadMatches();
    </script>
</body>
</html>
