<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL IA Pronostics</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #ef4444;
            --border-color: #1e293b;
            --blue-color: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--text-color);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab.active {
            background-color: var(--accent-color);
            color: white;
        }

        .dates-bar {
            display: flex;
            justify-content: flex-start;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
            scroll-behavior: smooth;
        }

        .dates-bar::-webkit-scrollbar { height: 4px; }
        .dates-bar::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 4px; }

        .date-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            text-align: center;
            cursor: pointer;
            min-width: 45px;
            flex-shrink: 0;
        }

        .date-item.active {
            border-color: var(--accent-color);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .date-item .day { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .date-item .num { font-size: 0.9rem; font-weight: bold; color: var(--text-color); }

        .section-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-info { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .team-row { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; }
        .team-row img { width: 24px; height: 24px; object-fit: contain; }

        .match-action { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .time-badge { background-color: var(--border-color); color: var(--text-muted); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .prono-btn { background-color: var(--accent-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .score-display { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); background-color: rgba(239, 68, 68, 0.1); padding: 4px 10px; border-radius: 6px; }

        .no-matches { text-align: center; color: var(--text-muted); padding: 40px; background-color: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color); }

        /* Style de la modale analytique complète */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            max-height: 92vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; }

        .analytics-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .analytics-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .prob-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .progress-bar {
            background-color: var(--border-color);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .bar-fill-home { background-color: var(--blue-color); height: 100%; }
        .bar-fill-draw { background-color: var(--text-muted); height: 100%; }
        .bar-fill-away { background-color: var(--accent-color); height: 100%; }

        .goalies-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .goalie-card {
            background: rgba(19, 27, 46, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.85rem;
        }

        .team-tabs-modal {
            display: flex;
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .team-tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .team-tab.active {
            background-color: var(--accent-color);
            color: white;
        }

        .player-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .player-table th {
            color: var(--text-muted);
            text-align: left;
            padding-bottom: 6px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        .player-table td {
            padding: 6px 0;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏒 NHL IA Pronostics</h1>
        </header>

        <div class="tabs">
            <div class="tab active" id="tabNhl" onclick="switchTab('nhl')">🏒 NHL</div>
            <div class="tab" id="tabFoot" onclick="switchTab('foot')">⚽ Football</div>
        </div>

        <div class="dates-bar" id="datesBar"></div>

        <div id="sectionTitle" class="section-title">MATCHS DU JOUR</div>
        
        <div id="matchesContainer">
            <div class="no-matches">Chargement des matchs...</div>
        </div>
    </div>

    <!-- Modale Analytique Riche -->
    <div class="modal" id="predictionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin: 0; font-size: 1rem;">Analyse Détaillée</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                Chargement des analyses...
            </div>
        </div>
    </div>

    <script>
        let currentSport = 'nhl';
        let selectedDate = new Date().toISOString().split('T')[0];
        let currentMatchData = null;

        function initDatesBar() {
            const bar = document.getElementById('datesBar');
            bar.innerHTML = '';
            
            for (let i = -5; i <= 14; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                
                const daysOfWeek = ['DI', 'LU', 'MA', 'ME', 'JE', 'VE', 'SA'];
                const dayName = i === 0 ? 'AJD' : daysOfWeek[d.getDay()];
                const dayNum = `${d.getDate()}.${d.getMonth() + 1}.`;

                const item = document.createElement('div');
                item.className = `date-item ${dateStr === selectedDate ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="day">${dayName}</div>
                    <div class="num">${dayNum}</div>
                `;
                item.onclick = () => {
                    selectedDate = dateStr;
                    initDatesBar();
                    loadMatches();
                };
                bar.appendChild(item);
            }
        }

        function switchTab(sport) {
            currentSport = sport;
            document.getElementById('tabNhl').className = `tab ${sport === 'nhl' ? 'active' : ''}`;
            document.getElementById('tabFoot').className = `tab ${sport === 'foot' ? 'active' : ''}`;
            loadMatches();
        }

        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            const titleEl = document.getElementById('sectionTitle');
            
            titleEl.innerText = currentSport === 'nhl' ? `MATCHS DU ${selectedDate}` : "SECTION FOOTBALL";
            container.innerHTML = `<div class="no-matches">Chargement...</div>`;

            if (currentSport === 'foot') {
                container.innerHTML = `<div class="no-matches">Aucun match de football disponible pour le moment.</div>`;
                return;
            }

            try {
                const response = await fetch(`/api/matches/nhl?date=${selectedDate}`);
                const data = await response.json();
                
                container.innerHTML = '';

                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = `<div class="no-matches">Aucun match prévu à cette date.</div>`;
                    return;
                }

                data.matches.forEach(m => {
                    let timeFormatted = "À venir";
                    if (m.time) {
                        const dateObj = new Date(m.time);
                        timeFormatted = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }

                    let actionHtml = '';
                    if (m.game_state === "OFF" || m.game_state === "FINAL") {
                        actionHtml = `<div class="score-display">${m.home_score} - ${m.away_score}</div>`;
                    } else {
                        actionHtml = `
                            <div class="time-badge">${timeFormatted}</div>
                            <button class="prono-btn" onclick="openPrediction('${m.home_team.replace(/'/g, "\\'")}', '${m.away_team.replace(/'/g, "\\'")}')">⚡ PRONO</button>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="team-info">
                            <div class="team-row">
                                <img src="${m.home_logo}" alt="" onerror="this.style.display='none'">
                                <span>${m.home_team}</span>
                            </div>
                            <div class="team-row">
                                <img src="${m.away_logo}" alt="" onerror="this.style.display='none'">
                                <span>${m.away_team}</span>
                            </div>
                        </div>
                        <div class="match-action">
                            ${actionHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = `<div class="no-matches">Erreur lors du chargement des matchs.</div>`;
            }
        }

        async function openPrediction(homeTeam, awayTeam) {
            const modal = document.getElementById('predictionModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.innerText = `${homeTeam} vs ${awayTeam}`;
            modalBody.innerHTML = `<div style="text-align: center; padding: 30px; color: var(--text-muted);">Génération de l'analyse multi-IA...</div>`;
            modal.style.display = 'flex';

            try {
                const response = await fetch('/predict/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: homeTeam, away_team: awayTeam })
                });
                currentMatchData = await response.json();

                if (currentMatchData.probabilities) {
                    renderModalContent('home');
                } else {
                    modalBody.innerHTML = `<div style="color: var(--accent-color); text-align: center;">Impossible de charger les données.</div>`;
                }
            } catch (e) {
                modalBody.innerHTML = `<div style="color: var(--accent-color); text-align: center;">Erreur de connexion au serveur.</div>`;
            }
        }

        function renderModalContent(activeTeamTab) {
            if (!currentMatchData) return;
            const res = currentMatchData;
            const modalBody = document.getElementById('modalBody');

            const pHome = res.probabilities.home_win;
            const pDraw = res.probabilities.draw;
            const pAway = res.probabilities.away_win;

            const homeTeamName = res.match.split(' vs ')[0];
            const awayTeamName = res.match.split(' vs ')[1];

            // Récupération dynamique des joueurs si fournis par l'API, sinon repli intelligent par équipe
            const playersList = activeTeamTab === 'home' ? (res.home_players || getFallbackPlayers(homeTeamName)) : (res.away_players || getFallbackPlayers(awayTeamName));

            let playersHtml = '';
            playersList.forEach(p => {
                playersHtml += `<tr><td>${p.name} (${p.pos})</td><td>${p.stats}</td><td><strong>${p.pct}%</strong></td></tr>`;
            });

            modalBody.innerHTML = `
                <!-- Probabilités Multi-IA -->
                <div class="analytics-section">
                    <div class="analytics-title">📊 Probabilités Multi-IA</div>
                    <div class="prob-row">
                        <span>Victoire ${homeTeamName}</span>
                        <span>${pHome}%</span>
                    </div>
                    <div class="progress-bar"><div class="bar-fill-home" style="width: ${pHome}%;"></div></div>

                    <div class="prob-row">
                        <span>Match Nul / Prolongations</span>
                        <span>${pDraw}%</span>
                    </div>
                    <div class="progress-bar"><div class="bar-fill-draw" style="width: ${pDraw}%;"></div></div>

                    <div class="prob-row">
                        <span>Victoire ${awayTeamName}</span>
                        <span>${pAway}%</span>
                    </div>
                    <div class="progress-bar"><div class="bar-fill-away" style="width: ${pAway}%;"></div></div>
                </div>

                <!-- Total Buts -->
                <div class="analytics-section">
                    <div class="analytics-title">🏒 Total Buts (Over / Under 5.5)</div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: bold;">
                        <span>Plus de 5.5 buts</span>
                        <span style="color: var(--accent-color);">${res.over_under_5_5.over_prob}%</span>
                    </div>
                </div>

                <!-- Gardiens & Power Play -->
                <div class="analytics-section">
                    <div class="analytics-title">🥅 Gardiens & Power Play</div>
                    <div class="goalies-grid">
                        <div class="goalie-card">
                            <div style="font-weight: bold; margin-bottom: 4px;">${res.goalies.home.name}</div>
                            <div style="color: var(--text-muted);">SV%: ${(res.goalies.home.save_pct * 100).toFixed(1)}%</div>
                        </div>
                        <div class="goalie-card">
                            <div style="font-weight: bold; margin-bottom: 4px;">${res.goalies.away.name}</div>
                            <div style="color: var(--text-muted);">SV%: ${(res.goalies.away.save_pct * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                </div>

                <!-- Projections Joueurs -->
                <div class="analytics-section">
                    <div class="analytics-title">👤 Projections Joueurs (Point %)</div>
                    <div class="team-tabs-modal">
                        <div class="team-tab ${activeTeamTab === 'home' ? 'active' : ''}" onclick="renderModalContent('home')">${homeTeamName}</div>
                        <div class="team-tab ${activeTeamTab === 'away' ? 'active' : ''}" onclick="renderModalContent('away')">${awayTeamName}</div>
                    </div>
                    <table class="player-table">
                        <thead>
                            <tr>
                                <th>Joueur</th>
                                <th>Stats</th>
                                <th>Point %</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${playersHtml}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function getFallbackPlayers(teamName) {
            const name = teamName.toLowerCase();
            if (name.includes('rangers')) {
                return [
                    { name: 'Artemi Panarin', pos: 'LW', stats: '7B / 11P', pct: 64 },
                    { name: 'Mika Zibanejad', pos: 'C', stats: '5B / 9P', pct: 58 },
                    { name: 'Adam Fox', pos: 'D', stats: '2B / 10P', pct: 53 }
                ];
            } else if (name.includes('anaheim')) {
                return [
                    { name: 'Troy Terry', pos: 'RW', stats: '6B / 6P', pct: 55 },
                    { name: 'Mason McTavish', pos: 'C', stats: '5B / 7P', pct: 51 },
                    { name: 'Cam Fowler', pos: 'D', stats: '1B / 6P', pct: 44 }
                ];
            } else {
                return [
                    { name: 'Top Buteur Star', pos: 'C', stats: '6B / 5P', pct: 56 },
                    { name: 'Ailier Offensif', pos: 'LW', stats: '4B / 6P', pct: 50 },
                    { name: 'Défenseur Leader', pos: 'D', stats: '2B / 5P', pct: 42 }
                ];
            }
        }

        function closeModal() {
            document.getElementById('predictionModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('predictionModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        initDatesBar();
        loadMatches();
    </script>
</body>
</html>
