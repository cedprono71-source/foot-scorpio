<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-IA NHL Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-success { background-color: rgba(34, 197, 94, 0.2); color: var(--success-color); }
        .badge-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger-color); }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tableau de Bord LNH</h1>
            <p>Moteur de Prédiction Avancé (Forme, Fatigue & Value)</p>
        </header>

        <div class="card">
            <h2>Paramètres du Match</h2>
            <div class="form-group">
                <label for="homeTeam">Équipe à Domicile</label>
                <input type="text" id="homeTeam" value="New York Rangers">
            </div>
            <div class="form-group">
                <label for="awayTeam">Équipe à l'Extérieur</label>
                <input type="text" id="awayTeam" value="New York Islanders">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="homeOdds">Cote Domicile (Optionnel)</label>
                    <input type="number" step="0.01" id="homeOdds" placeholder="ex: 1.95">
                </div>
                <div class="form-group">
                    <label for="awayOdds">Cote Extérieur (Optionnel)</label>
                    <input type="number" step="0.01" id="awayOdds" placeholder="ex: 2.10">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label><input type="checkbox" id="homeB2B"> Domicile en Back-to-Back</label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="awayB2B"> Extérieur en Back-to-Back</label>
                </div>
            </div>
            <button onclick="runPrediction()">Lancer l'Analyse</button>
        </div>

        <div class="card">
            <h2>Résultats de la Prédiction</h2>
            <div id="predictionResult" class="result-box">
                <p style="color: var(--text-muted); text-align: center;">Lancez une prédiction pour voir les résultats.</p>
            </div>
        </div>
    </div>

    <script>
        async function runPrediction() {
            const homeTeam = document.getElementById('homeTeam').value;
            const awayTeam = document.getElementById('awayTeam').value;
            const homeOdds = parseFloat(document.getElementById('homeOdds').value) || 0.0;
            const awayOdds = parseFloat(document.getElementById('awayOdds').value) || 0.0;
            const homeB2b = document.getElementById('homeB2B').checked;
            const awayB2b = document.getElementById('awayB2B').checked;

            const resultBox = document.getElementById('predictionResult');
            resultBox.innerHTML = "<p style='text-align: center;'>Calcul en cours...</p>";

            try {
                const response = await fetch('/predict/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        home_team: homeTeam,
                        away_team: awayTeam,
                        home_expected_goals: 3.1,
                        away_expected_goals: 2.7,
                        home_b2b: homeB2b,
                        away_b2b: awayB2b,
                        home_odds: homeOdds,
                        away_odds: awayOdds
                    })
                });

                const data = await response.json();

                let valueHtml = '';
                if (data.advanced_metrics.home_value_edge !== null) {
                    const hEdge = data.advanced_metrics.home_value_edge;
                    const aEdge = data.advanced_metrics.away_value_edge;
                    valueHtml = `
                        <hr style="border-color: var(--border-color); margin: 10px 0;">
                        <div class="stat-row"><span>Value Edge (Domicile):</span> <span class="badge ${hEdge >= 0 ? 'badge-success' : 'badge-danger'}">${hEdge > 0 ? '+' : ''}${hEdge}%</span></div>
                        <div class="stat-row"><span>Value Edge (Extérieur):</span> <span class="badge ${aEdge >= 0 ? 'badge-success' : 'badge-danger'}">${aEdge > 0 ? '+' : ''}${aEdge}%</span></div>
                    `;
                }

                resultBox.innerHTML = `
                    <div class="stat-row"><strong>Match :</strong> <span>${data.match}</span></div>
                    <div class="stat-row"><strong>Score Prédit :</strong> <span style="color: var(--accent-color);">${data.predicted_score}</span></div>
                    <hr style="border-color: var(--border-color); margin: 10px 0;">
                    <div class="stat-row"><span>Victoire Domicile :</span> <strong>${data.probabilities.home_win}%</strong></div>
                    <div class="stat-row"><span>Match Nul :</span> <strong>${data.probabilities.draw}%</strong></div>
                    <div class="stat-row"><span>Victoire Extérieur :</span> <strong>${data.probabilities.away_win}%</strong></div>
                    <div class="stat-row"><span>Over 5.5 Buts :</span> <strong>${data.over_under_5_5.over_prob}%</strong></div>
                    <hr style="border-color: var(--border-color); margin: 10px 0;">
                    <div class="stat-row"><span>Indice Forme (dom / ext) :</span> <span>${data.advanced_metrics.home_form_factor.toFixed(2)} / ${data.advanced_metrics.away_form_factor.toFixed(2)}</span></div>
                    <div class="stat-row"><span>Réussite OT/SO (dom / ext) :</span> <span>${(data.advanced_metrics.home_ot_win_rate * 100).toFixed(0)}% / ${(data.advanced_metrics.away_ot_win_rate * 100).toFixed(0)}%</span></div>
                    ${valueHtml}
                `;
            } catch (error) {
                resultBox.innerHTML = "<p style='color: var(--danger-color); text-align: center;'>Erreur de communication avec l'API.</p>";
            }
        }
    </script>
</body>
</html>
