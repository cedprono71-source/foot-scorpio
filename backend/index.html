<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-IA NHL & Football Dashboard</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1e1e2f;
            --accent-color: #4ecca3;
            --accent-hover: #45b393;
            --text-color: #ffffff;
            --text-muted: #a0a0c0;
            --border-color: #2f2f45;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--accent-color);
            font-size: 1.3em;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="date"], select, button {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: #0f111a;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .match-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .match-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-item:hover {
            border-color: var(--accent-color);
            background-color: rgba(78, 204, 163, 0.05);
        }

        .match-teams {
            font-weight: 600;
        }

        .match-time {
            font-size: 0.85em;
            color: var(--text-muted);
        }

        .prediction-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .prediction-box h3 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .multi-ai-card {
            background: #151722;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>🏒⚽ Multi-IA Dashboard</h1>
        <p>Moteur de prédiction unifié - LNH & Football (v17.0)</p>
    </header>

    <div class="container">
        <!-- Section Football -->
        <div class="panel">
            <h2>⚽ Football (Ligue 1, Premier League, PPL...)</h2>
            <div class="controls">
                <input type="date" id="foot-date">
                <button onclick="loadFootMatches()">Charger les matchs</button>
            </div>
            <div id="foot-matches" class="match-list">
                <p style="color: var(--text-muted); text-align: center;">Sélectionnez une date pour afficher les matchs.</p>
            </div>
            <div id="foot-result" class="prediction-box" style="display:none;"></div>
        </div>

        <!-- Section NHL -->
        <div class="panel">
            <h2>🏒 LNH / NHL</h2>
            <div class="controls">
                <input type="date" id="nhl-date">
                <button onclick="loadNhlMatches()">Charger les matchs</button>
            </div>
            <div id="nhl-matches" class="match-list">
                <p style="color: var(--text-muted); text-align: center;">Sélectionnez une date pour afficher les matchs.</p>
            </div>
            <div id="nhl-result" class="prediction-box" style="display:none;"></div>
        </div>
    </div>

    <script>
        // Initialisation des dates du jour par défaut
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('foot-date').value = today;
        document.getElementById('nhl-date').value = today;

        // Charger les matchs de Football
        async function loadFootMatches() {
            const date = document.getElementById('foot-date').value;
            const container = document.getElementById('foot-matches');
            container.innerHTML = '<p style="text-align: center;">Chargement...</p>';

            try {
                const res = await fetch(`/api/matches/foot?date=${date}`);
                const data = await res.json();
                
                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Aucun match trouvé pour cette date.</p>';
                    return;
                }

                container.innerHTML = '';
                data.matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'match-item';
                    div.innerHTML = `
                        <div class="match-teams">${m.home_team} vs ${m.away_team}</div>
                        <div class="match-time">${m.game_state === 'OFF' ? 'Terminé' : 'À venir'}</div>
                    `;
                    div.onclick = () => predictFootMatch(m.home_team, m.away_team, m.home_id, m.away_id);
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Erreur de chargement des matchs.</p>';
            }
        }

        // Lancer la prédiction Football avec Multi-IA Consensus
        async function predictFootMatch(home, away, homeId, awayId) {
            const resultBox = document.getElementById('foot-result');
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p style="text-align: center;">Analyse Multi-IA en cours...</p>';

            try {
                const res = await fetch('/predict/match/foot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: home, away_team: away, home_id: homeId, away_id: awayId })
                });
                const data = await res.json();

                let consensusHtml = '';
                if (data.multi_ai_consensus) {
                    const conf = data.multi_ai_consensus.confidence_score;
                    const ai1 = data.multi_ai_consensus.ai_1_poisson;
                    const ai2 = data.multi_ai_consensus.ai_2_trends;
                    
                    consensusHtml = `
                        <div class="multi-ai-card">
                            <h4 style="margin: 0 0 8px 0; color: var(--accent-color);">🧠 Consensus Multi-IA</h4>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                <span>Indice de Confiance :</span>
                                <strong style="color: var(--accent-color);">${conf}</strong>
                            </div>
                            <div style="font-size: 0.85em; opacity: 0.85; border-top: 1px solid var(--border-color); padding-top: 6px;">
                                <div>• <strong>IA 1 (Poisson / xG) :</strong> 1: ${ai1.home}% | X: ${ai1.draw}% | 2: ${ai1.away}%</div>
                                <div>• <strong>IA 2 (Tendances ML) :</strong> 1: ${ai2.home}% | X: ${ai2.draw}% | 2: ${ai2.away}%</div>
                            </div>
                        </div>
                    `;
                }

                resultBox.innerHTML = `
                    <h3>${data.match}</h3>
                    <p><strong>Score Prédit :</strong> ${data.predicted_score}</p>
                    <p><strong>Probabilités Globales :</strong> Domicile: ${data.probabilities.home_win}% | Nul: ${data.probabilities.draw}% | Extérieur: ${data.probabilities.away_win}%</p>
                    <p style="font-size: 0.9em; color: var(--text-muted);">Over 2.5: ${data.over_under_2_5.over_prob}% | BTTS (Les deux marquent): ${data.btts.yes_prob}%</p>
                    ${consensusHtml}
                `;
            } catch (err) {
                resultBox.innerHTML = '<p style="color: #ff6b6b;">Erreur lors du calcul de la prédiction.</p>';
            }
        }

        // Charger les matchs NHL (similaire)
        async function loadNhlMatches() {
            const date = document.getElementById('nhl-date').value;
            const container = document.getElementById('nhl-matches');
            container.innerHTML = '<p style="text-align: center;">Chargement...</p>';

            try {
                const res = await fetch(`/api/matches/nhl?date=${date}`);
                const data = await res.json();
                
                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Aucun match NHL trouvé pour cette date.</p>';
                    return;
                }

                container.innerHTML = '';
                data.matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'match-item';
                    div.innerHTML = `
                        <div class="match-teams">${m.home_team} vs ${m.away_team}</div>
                        <div class="match-time">${m.game_state}</div>
                    `;
                    div.onclick = () => predictNhlMatch(m.home_team, m.away_team);
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Erreur de chargement.</p>';
            }
        }

        async function predictNhlMatch(home, away) {
            const resultBox = document.getElementById('nhl-result');
            resultBox.style.display = 'block';
            resultBox.innerHTML = '<p style="text-align: center;">Analyse LNH en cours...</p>';

            try {
                const res = await fetch('/predict/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: home, away_team: away })
                });
                const data = await res.json();

                resultBox.innerHTML = `
                    <h3>${data.match}</h3>
                    <p><strong>Score Prédit :</strong> ${data.predicted_score}</p>
                    <p>Victoire Domicile : ${data.probabilities.home_win}% | Nul/OT : ${data.probabilities.draw}% | Victoire Extérieur : ${data.probabilities.away_win}%</p>
                    <p>Over 5.5 : ${data.over_under_5_5.over_prob}%</p>
                    <p style="font-size: 0.9em; color: var(--text-muted);">Gardiens : ${data.goalies.home.name} vs ${data.goalies.away.name}</p>
                `;
            } catch (err) {
                resultBox.innerHTML = '<p style="color: #ff6b6b;">Erreur de prédiction.</p>';
            }
        }

        // Chargement automatique au démarrage pour la date du jour
        window.onload = () => {
            loadFootMatches();
            loadNhlMatches();
        };
    </script>
</body>
</html>
