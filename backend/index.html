<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-IA Sports Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .card-foot:hover { border-color: #ef4444; }
        .card-nhl:hover { border-color: #3b82f6; }
        /* Masquer la scrollbar pour un design propre sur mobile */
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

    <!-- HEADER / SWITCHER DE SPORT -->
    <header class="w-full py-6 px-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span id="app-icon" class="text-3xl">⚽</span>
                <div>
                    <h1 id="app-title" class="text-xl font-bold tracking-tight">Football Pronostics IA</h1>
                    <p class="text-xs text-slate-400">Moteur Consensus 5 Modèles</p>
                </div>
            </div>
            
            <div class="flex bg-slate-800 p-1 rounded-xl gap-1">
                <button onclick="switchSport('foot')" id="btn-foot" class="px-5 py-2 rounded-lg text-sm font-semibold transition-all bg-red-600 text-white shadow-lg">⚽ Football</button>
                <button onclick="switchSport('nhl')" id="btn-nhl" class="px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white">🏒 NHL</button>
            </div>
        </div>
    </header>

    <!-- CALENDRIER DES JOURS & MATCHS -->
    <main class="max-w-4xl mx-auto px-4 mt-6">
        <div class="flex items-center justify-between mb-4">
            <h2 id="calendar-title" class="text-sm font-semibold uppercase tracking-wider text-slate-400">Calendrier</h2>
            <span id="current-date-label" class="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-300"></span>
        </div>
        <div id="calendar-strip" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none"></div>

        <!-- LISTE DES MATCHS -->
        <div class="mt-8">
            <div class="flex items-center justify-between mb-4">
                <h3 id="matches-section-title" class="text-lg font-bold">Matchs du jour</h3>
                <span id="match-count" class="text-xs text-slate-400">Chargement...</span>
            </div>
            <div id="matches-container" class="space-y-3">
                <div class="text-center py-12 text-slate-500">Chargement des matchs en cours...</div>
            </div>
        </div>
    </main>

    <!-- MODALE DES PRONOSTICS -->
    <div id="prediction-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div id="modal-content-box" class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 relative shadow-2xl my-8">
            <button onclick="closeModal()" id="modal-close-btn" class="absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors bg-slate-800">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        let currentSport = 'foot';
        let selectedDate = new Date().toISOString().split('T')[0];
        let cachedMatches = { foot: {}, nhl: {} };

        window.onload = () => {
            buildCalendar('foot');
            buildCalendar('nhl');
            // Chargement simultané optimisé pour la vitesse
            Promise.all([
                loadFootMatches(),
                loadNhlMatches()
            ]);
        };

        function switchSport(sport) {
            currentSport = sport;
            const isFoot = (sport === 'foot');
            
            document.getElementById('app-icon').innerText = isFoot ? '⚽' : '🏒';
            document.getElementById('app-title').innerText = isFoot ? 'Football Pronostics IA' : 'NHL Pronostics IA';
            
            const btnFoot = document.getElementById('btn-foot');
            const btnNhl = document.getElementById('btn-nhl');
            
            if (isFoot) {
                btnFoot.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all bg-red-600 text-white shadow-lg";
                btnNhl.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white";
            } else {
                btnNhl.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all bg-blue-600 text-white shadow-lg";
                btnFoot.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white";
            }

            buildCalendar(sport);
            renderMatches();
        }

        function buildCalendar(sport) {
            const strip = document.getElementById('calendar-strip');
            if (sport !== currentSport) return;
            strip.innerHTML = '';

            const today = new Date();
            for (let i = -3; i <= 3; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                
                const dayName = d.toLocaleDateString('fr-FR', { weekday: 'short' });
                const dayNum = d.getDate();
                const monthName = d.toLocaleDateString('fr-FR', { month: 'short' });

                const isSelected = (dateStr === selectedDate);
                const activeClass = isSelected 
                    ? (currentSport === 'foot' ? 'bg-red-600 text-white border-red-500 shadow-lg' : 'bg-blue-600 text-white border-blue-500 shadow-lg')
                    : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:border-slate-700';

                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center justify-center min-w-[70px] py-3 rounded-xl border transition-all ${activeClass}`;
                btn.innerHTML = `
                    <span class="text-[10px] uppercase font-medium">${dayName}</span>
                    <span class="text-lg font-bold">${dayNum}</span>
                    <span class="text-[10px]">${monthName}</span>
                `;
                btn.onclick = () => {
                    selectedDate = dateStr;
                    buildCalendar(currentSport);
                    renderMatches();
                };
                strip.appendChild(btn);
            }
            document.getElementById('current-date-label').innerText = selectedDate;
        }

        async function loadFootMatches() {
            try {
                const res = await fetch(`/api/matches/foot?date=${selectedDate}`);
                const data = await res.json();
                cachedMatches.foot[selectedDate] = data.matches || [];
            } catch (e) {
                cachedMatches.foot[selectedDate] = [];
            }
            if (currentSport === 'foot') renderMatches();
        }

        async function loadNhlMatches() {
            try {
                const res = await fetch(`/api/matches/nhl?date=${selectedDate}`);
                const data = await res.json();
                cachedMatches.nhl[selectedDate] = data.matches || [];
            } catch (e) {
                cachedMatches.nhl[selectedDate] = [];
            }
            if (currentSport === 'nhl') renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            if (!cachedMatches[currentSport][selectedDate]) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500">Chargement...</div>`;
                if (currentSport === 'foot') loadFootMatches();
                else loadNhlMatches();
                return;
            }

            const matches = cachedMatches[currentSport][selectedDate];
            document.getElementById('match-count').innerText = `${matches.length} match(s) trouvé(s)`;

            if (matches.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 bg-slate-900/40 rounded-2xl border border-slate-800/60">Aucun match programmé pour cette date.</div>`;
                return;
            }

            matches.forEach(m => {
                const card = document.createElement('div');
                const hoverBorder = currentSport === 'foot' ? 'card-foot' : 'card-nhl';
                card.className = `bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 transition-all ${hoverBorder}`;
                
                const scoreDisplay = (m.home_score !== null && m.away_score !== null)
                    ? `<span class="text-xl font-black px-3 py-1 bg-slate-800 rounded-lg">${m.home_score} - ${m.away_score}</span>`
                    : `<span class="text-sm font-semibold text-slate-400 bg-slate-800/60 px-3 py-1 rounded-lg">${m.game_state}</span>`;

                card.innerHTML = `
                    <div class="flex items-center gap-4 w-full sm:w-2/5 justify-end">
                        <span class="font-semibold text-right text-sm sm:text-base">${m.home_team}</span>
                        <img src="${m.home_logo || 'https://via.placeholder.com/32'}" class="w-8 h-8 object-contain" onerror="this.src='https://via.placeholder.com/32'">
                    </div>
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-[10px] text-slate-500 uppercase font-bold">${m.league}</span>
                        ${scoreDisplay}
                    </div>
                    <div class="flex items-center gap-4 w-full sm:w-2/5 justify-start">
                        <img src="${m.away_logo || 'https://via.placeholder.com/32'}" class="w-8 h-8 object-contain" onerror="this.src='https://via.placeholder.com/32'">
                        <span class="font-semibold text-sm sm:text-base">${m.away_team}</span>
                    </div>
                    <button onclick='openPrediction(${JSON.stringify(m)})' class="w-full sm:w-auto px-4 py-2 rounded-xl text-xs font-bold transition-all ${currentSport === 'foot' ? 'bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/20' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/20'}">
                        ⚡ PRONO
                    </button>
                `;
                container.appendChild(card);
            });
        }

        async function openPrediction(match) {
            const modal = document.getElementById('prediction-modal');
            const modalBody = document.getElementById('modal-body');
            const closeBtn = document.getElementById('modal-close-btn');
            
            modal.classList.remove('hidden');
            modalBody.innerHTML = `<div class="text-center py-12 text-slate-400 animate-pulse">Analyse des 5 modèles IA en cours...</div>`;

            // Bouton de fermeture thématisé
            if (currentSport === 'foot') {
                closeBtn.className = "absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors bg-red-600/20 hover:bg-red-600";
            } else {
                closeBtn.className = "absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors bg-blue-600/20 hover:bg-blue-600";
            }

            try {
                const endpoint = (currentSport === 'foot') ? '/predict/match/foot' : '/predict/match';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: match.home_team, away_team: match.away_team })
                });
                const data = await res.json();
                renderModalContent(data);
            } catch (e) {
                modalBody.innerHTML = `<div class="text-center py-12 text-red-500">Erreur lors du calcul des pronostics.</div>`;
            }
        }

        function renderModalContent(data) {
            const modalBody = document.getElementById('modal-body');
            const p = data.probabilities;
            
            if (currentSport === 'foot') {
                modalBody.innerHTML = `
                    <div class="text-center mb-6">
                        <span class="text-xs font-bold text-red-500 uppercase tracking-wider">Consensus 5 IA • Football</span>
                        <h3 class="text-xl font-bold mt-1">${data.match}</h3>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mb-6 text-center">
                        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                            <span class="text-xs text-slate-400 block">1 (Domicile)</span>
                            <span class="text-lg font-black text-red-400">${p.home_win}%</span>
                        </div>
                        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                            <span class="text-xs text-slate-400 block">Nul</span>
                            <span class="text-lg font-black text-slate-300">${p.draw}%</span>
                        </div>
                        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                            <span class="text-xs text-slate-400 block">2 (Extérieur)</span>
                            <span class="text-lg font-black text-red-400">${p.away_win}%</span>
                        </div>
                    </div>
                    <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-800 space-y-3 mb-6">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Score Prédit :</span>
                            <span class="font-bold text-white">${data.predicted_score}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Les 2 marquent (BTTS) :</span>
                            <span class="font-bold text-white">${data.btts.yes_prob}%</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Plus de 2.5 buts :</span>
                            <span class="font-bold text-white">${data.over_under_2_5.over_prob}%</span>
                        </div>
                    </div>
                    <div class="bg-red-950/30 border border-red-900/30 p-4 rounded-xl">
                        <span class="text-xs font-bold text-red-400 block mb-1">Conseil 1ère Mi-Temps</span>
                        <p class="text-sm text-slate-300">${data.first_half.action_conseillee} (Prob. >0.5 : ${data.first_half.over_0_5_prob}%)</p>
                    </div>
                `;
            } else {
                let playersHtml = '';
                if (data.home_players) {
                    data.home_players.forEach(pl => {
                        playersHtml += `<div class="flex justify-between text-xs py-1 border-b border-slate-800"><span class="text-slate-300">${pl.name} (${pl.pos})</span><span class="font-bold text-blue-400">${pl.stats}</span></div>`;
                    });
                }
                modalBody.innerHTML = `
                    <div class="text-center mb-6">
                        <span class="text-xs font-bold text-blue-400 uppercase tracking-wider">Consensus 5 IA • NHL</span>
                        <h3 class="text-xl font-bold mt-1">${data.match}</h3>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-6 text-center">
                        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                            <span class="text-xs text-slate-400 block">Victoire Domicile</span>
                            <span class="text-lg font-black text-blue-400">${p.home_win}%</span>
                        </div>
                        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                            <span class="text-xs text-slate-400 block">Victoire Extérieur</span>
                            <span class="text-lg font-black text-blue-400">${p.away_win}%</span>
                        </div>
                    </div>
                    <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-800 space-y-3 mb-6">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Score Prédit :</span>
                            <span class="font-bold text-white">${data.predicted_score}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Plus de 5.5 buts :</span>
                            <span class="font-bold text-white">${data.over_under_5_5.over_prob}%</span>
                        </div>
                    </div>
                    <div class="bg-blue-950/30 border border-blue-900/30 p-4 rounded-xl">
                        <span class="text-xs font-bold text-blue-400 block mb-2">Joueurs Clés & Effectif</span>
                        <div class="space-y-1">${playersHtml}</div>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('prediction-modal').classList.add('hidden');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('prediction-modal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
