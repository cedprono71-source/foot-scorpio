<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Pronostics IA - NHL & Football</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* FOND D'ÉCRAN GLOBAL GLASSMORPHISM */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0d1117;
            color: #f0f6fc; 
            padding: 0; 
            min-height: 100vh;
        }
        
        header { 
            background: rgba(13, 17, 23, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            padding: 12px 16px; 
            color: #ffffff; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
        }
        .header-title { font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        
        .sport-selector { display: flex; gap: 6px; background: rgba(22, 27, 34, 0.6); backdrop-filter: blur(8px); padding: 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
        .sport-tab { flex: 1; text-align: center; padding: 6px 6px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: #8fa3b3; transition: all 0.2s ease; white-space: nowrap; }
        .sport-tab.active { background: linear-gradient(135deg, #e11238 0%, #b91c1c 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(225,18,56,0.4); }

        .date-strip-container { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(12px); display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .date-strip { display: flex; overflow-x: auto; white-space: nowrap; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; width: 100%; }
        .date-strip::-webkit-scrollbar { display: none; }
        .date-item { flex: 0 0 auto; width: 54px; padding: 10px 0 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; background: transparent; transition: background 0.2s; }
        .date-item .day-name { font-size: 0.65rem; font-weight: 700; color: #8fa3b3; text-transform: uppercase; }
        .date-item .day-num { font-size: 0.8rem; font-weight: 700; color: #f0f6fc; margin-top: 2px; }
        .date-item.active .day-name, .date-item.active .day-num { color: #ff5269; }
        .date-item.active::after { content: ''; position: absolute; bottom: 0; left: 15%; width: 70%; height: 3px; background: linear-gradient(90deg, #e11238, #ff5269); border-radius: 2px; }

        .main-content { min-height: 100vh; padding: 14px; }
        .section-title { font-size: 0.75rem; font-weight: 700; color: #8fa3b3; text-transform: uppercase; padding: 6px 4px 12px 4px; letter-spacing: 0.5px; }
        
        /* CARTES DE MATCHS STYLE GLASSMORPHISM */
        .match-card { 
            background: rgba(22, 27, 34, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px; 
            padding: 14px 16px; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer; 
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease; 
        }
        .match-card:active { 
            transform: scale(0.97); 
            background: rgba(30, 36, 46, 0.85);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        
        .match-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        
        .teams-list { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .team-item { display: flex; align-items: center; gap: 12px; font-size: 0.95rem; font-weight: 700; color: #f0f6fc; }
        .team-logo { width: 34px; height: 34px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        
        .match-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .match-time { font-size: 0.75rem; font-weight: 700; color: #8fa3b3; background: rgba(255, 255, 255, 0.05); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.06); }
        
        .btn-prono-badge { 
            background: linear-gradient(135deg, #e11238 0%, #b91c1c 100%);
            color: #ffffff; 
            font-size: 0.72rem; 
            font-weight: 700; 
            padding: 6px 12px; 
            border-radius: 8px; 
            border: none; 
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 15px rgba(225, 18, 56, 0.4);
            letter-spacing: 0.3px;
            transition: transform 0.2s;
        }
        .btn-prono-badge:active { transform: scale(0.95); }

        .no-match { text-align: center; color: #8fa3b3; padding: 40px 16px; font-size: 0.9rem; background: rgba(22, 27, 34, 0.5); backdrop-filter: blur(8px); border-radius: 14px; border: 1px solid rgba(255,255,255,0.06); }

        .history-summary { display: flex; gap: 10px; padding: 14px; background: rgba(22, 27, 34, 0.65); backdrop-filter: blur(12px); color: #ffffff; border-radius: 14px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .stat-card { flex: 1; background: rgba(30, 36, 46, 0.6); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
        .stat-val { font-size: 1.4rem; font-weight: bold; color: #3fb950; margin-top: 4px; }
        .stat-label { font-size: 0.65rem; color: #8fa3b3; text-transform: uppercase; font-weight: bold; }

        .history-item { 
            background: rgba(22, 27, 34, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px; 
            padding: 12px 16px; 
            margin-bottom: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.3); 
        }
        .history-match-title { font-size: 0.85rem; font-weight: 700; color: #f0f6fc; }
        .history-sub { font-size: 0.75rem; color: #8fa3b3; margin-top: 2px; }
        .badge-win { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.3); font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 6px; }
        .badge-loss { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 6px; }
        .badge-pending { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 6px; }

        /* POPUP MODAL EN MODE SOMBRE & GLASSMORPHISM */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 12px; }
        .modal-content { background: #161b22; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; padding: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); position: relative; color: #f0f6fc; }
        .modal-close { position: absolute; top: 14px; right: 16px; background: rgba(255,255,255,0.06); border: none; color: #8fa3b3; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .modal-close:active { background: rgba(255,255,255,0.15); }
        
        .modal-header-teams { display: flex; align-items: center; justify-content: space-around; margin: 12px 0 16px 0; }
        .modal-team-box { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; width: 40%; }
        .modal-team-logo { width: 48px; height: 48px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
        .modal-team-name { font-size: 0.85rem; font-weight: bold; color: #f0f6fc; }
        .vs-badge { font-size: 0.75rem; font-weight: bold; color: #8fa3b3; background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.04); }
        
        .prono-box { background: rgba(13, 17, 23, 0.6); border-radius: 12px; padding: 14px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.06); }
        .prono-section-title { font-size: 0.75rem; font-weight: bold; color: #8fa3b3; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .predicted-score-box { background: #0d1117; text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08); }
        .predicted-score-val { font-size: 1.4rem; font-weight: bold; color: #3fb950; letter-spacing: 1px; }
        
        .prob-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 0.82rem; color: #f0f6fc; }
        .prob-bar-container { background-color: rgba(255,255,255,0.06); height: 7px; border-radius: 4px; width: 100%; overflow: hidden; margin-bottom: 10px; }
        .prob-bar { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
        .prob-bar.home { background: linear-gradient(90deg, #238636, #2ea043); }
        .prob-bar.draw { background: linear-gradient(90deg, #bb8009, #d29922); }
        .prob-bar.away { background: linear-gradient(90deg, #da3633, #f85149); }
        .prob-bar.over { background: linear-gradient(90deg, #8957e5, #a371f7); }

        .goalies-box { display: flex; gap: 8px; background: rgba(56, 139, 253, 0.08); border: 1px solid rgba(56, 139, 253, 0.2); border-radius: 10px; padding: 10px; margin-top: 10px; margin-bottom: 12px; }
        .goalie-card { flex: 1; font-size: 0.75rem; color: #58a6ff; }
        .goalie-name { font-weight: bold; margin-bottom: 3px; color: #79c0ff; }

        .injuries-box { background: rgba(248, 81, 73, 0.08); border: 1px solid rgba(248, 81, 73, 0.2); border-radius: 10px; padding: 10px; margin-top: 10px; margin-bottom: 12px; font-size: 0.75rem; color: #f85149; }

        .ia-badge-tag { display: inline-block; background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); border-radius: 6px; padding: 3px 8px; font-size: 0.7rem; font-weight: bold; margin-bottom: 10px; }

        .ia-picks-box { background: rgba(22, 27, 34, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 10px; margin-top: 10px; margin-bottom: 12px; }
        .ia-pick-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; padding: 4px 0; }
        .ia-pick-label { font-weight: bold; color: #f0f6fc; display: flex; align-items: center; gap: 4px; }
        .ia-pick-val { font-weight: 700; color: #ff5269; }

        .team-tabs-players { display: flex; gap: 6px; margin-top: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 2px; }
        .team-tab-btn { flex: 1; padding: 8px; text-align: center; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: #8fa3b3; background: rgba(255,255,255,0.04); border-radius: 8px 8px 0 0; transition: all 0.2s; }
        .team-tab-btn.active { background: #21262d; color: #f0f6fc; border-top: 2px solid #e11238; }

        .players-table-container { max-height: 200px; overflow-y: auto; margin-top: 8px; scrollbar-width: thin; }
        .players-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .players-table th { background: #161b22; position: sticky; top: 0; padding: 8px 6px; text-align: left; color: #8fa3b3; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .players-table td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #f0f6fc; }
        .prob-badge { font-weight: bold; color: #58a6ff; }
    </style>
</head>
<body>
    <header>
        <div class="header-title"><span id="app-icon">🏒</span> <span id="app-title">NHL IA Pronostics</span></div>
        <div class="sport-selector">
            <div class="sport-tab active" id="tab-nhl" onclick="switchSport('nhl')">🏒 NHL</div>
            <div class="sport-tab" id="tab-football" onclick="switchSport('football')">⚽ Football</div>
            <div class="sport-tab" id="tab-history" onclick="switchSport('history')">📈 Bilan</div>
        </div>
    </header>

    <div class="date-strip-container" id="date-strip-wrapper">
        <div class="date-strip" id="date-strip"></div>
    </div>

    <div class="main-content">
        <div class="section-title" id="section-title">SELECTIONNEZ UNE DATE</div>
        <div id="matches-container">
            <div class="no-match">👈 Choisissez une date ci-dessus pour afficher les matchs.</div>
        </div>
    </div>

    <!-- POP-UP PRONOSTIC -->
    <div class="modal-overlay" id="prono-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modal-teams-header"></div>
            <div id="modal-body">
                <div class="no-match" style="margin-top: 20px;">Calcul du pronostic IA...</div>
            </div>
        </div>
    </div>

    <script>
        const daysFr = ['DI', 'LU', 'MA', 'ME', 'JE', 'VE', 'SA'];
        let currentSport = 'nhl';
        let currentMatchPlayers = {};
        
        function formatDateLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const todayDate = new Date();
        const todayStr = formatDateLocal(todayDate);
        let selectedDateStr = todayStr;

        function switchSport(sport) {
            currentSport = sport;
            document.querySelectorAll('.sport-tab').forEach(tab => tab.classList.remove('active'));
            const container = document.getElementById('matches-container');
            
            if (sport === 'nhl') {
                document.getElementById('tab-nhl').classList.add('active');
                document.getElementById('date-strip-wrapper').style.display = 'flex';
                document.getElementById('app-icon').innerText = '🏒';
                document.getElementById('app-title').innerText = 'NHL IA Pronostics';
                if (selectedDateStr) chargerMatchs(selectedDateStr);
            } else if (sport === 'football') {
                document.getElementById('tab-football').classList.add('active');
                document.getElementById('date-strip-wrapper').style.display = 'none';
                document.getElementById('app-icon').innerText = '⚽';
                document.getElementById('app-title').innerText = 'Football IA Pronostics';
                document.getElementById('section-title').innerText = "SECTION FOOTBALL";
                container.innerHTML = '<div class="no-match">⚽ Section Football en cours d\'intégration.</div>';
            } else if (sport === 'history') {
                document.getElementById('tab-history').classList.add('active');
                document.getElementById('date-strip-wrapper').style.display = 'none';
                document.getElementById('app-icon').innerText = '📈';
                document.getElementById('app-title').innerText = 'Bilan & Performance IA';
                chargerHistorique();
            }
        }

        function generateDateStrip(centerDateStr) {
            const strip = document.getElementById('date-strip');
            strip.innerHTML = '';
            
            let parts = (centerDateStr || todayStr).split('-');
            let baseDate = new Date(parts[0], parts[1] - 1, parts[2]);

            let todayObj = new Date();
            todayObj.setHours(0,0,0,0);

            for (let i = 0; i <= 14; i++) {
                let d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + i);
                let dateStr = formatDateLocal(d);
                
                let dCompare = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                if (dCompare < todayObj) continue;

                let isToday = (dateStr === todayStr);
                let dayName = isToday ? 'AJD' : daysFr[d.getDay()];
                let dayNum = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;

                let item = document.createElement('div');
                item.className = `date-item ${dateStr === selectedDateStr ? 'active' : ''}`;
                item.dataset.date = dateStr;
                item.onclick = () => selectDate(dateStr, item);
                item.innerHTML = `<span class="day-name">${dayName}</span><span class="day-num">${dayNum}</span>`;
                strip.appendChild(item);
            }
        }

        function selectDate(dateStr, element) {
            selectedDateStr = dateStr;
            document.querySelectorAll('.date-item').forEach(el => el.classList.remove('active'));
            if (element) { element.classList.add('active'); }
            
            document.getElementById('section-title').innerText = `MATCHS DU ${dateStr.split('-').reverse().join('/')}`;
            chargerMatchs(dateStr);
        }

        async function chargerMatchs(dateStr) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '<div class="no-match">Chargement des matchs...</div>';

            try {
                const response = await fetch(`/api/matches/nhl?date=${dateStr}`);
                const data = await response.json();
                container.innerHTML = '';

                const matchsDuJour = (data.matches || []).filter(match => {
                    if (!match.time) return match.date === dateStr;
                    const matchLocalDate = formatDateLocal(new Date(match.time));
                    return matchLocalDate === dateStr;
                });

                if (matchsDuJour.length > 0) {
                    matchsDuJour.forEach(match => {
                        const card = document.createElement('div');
                        card.className = 'match-card';
                        card.onclick = () => showPrediction(match.home_team, match.away_team, match.home_logo, match.away_logo);
                        
                        const matchTime = match.time
